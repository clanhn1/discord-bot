<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | OFFICIAL</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@800&family=Caveat:wght@700&family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --royal-white: #ffffff; --glass: rgba(255, 255, 255, 0.05); }

        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: 'Poppins', sans-serif; }

        /* شاشة الترحيب التلقائية */
        #auto-welcome {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 1.5s ease-in-out;
        }
        .loading-text { color: #fff; font-family: 'Anek Malayalam'; font-size: 30px; opacity: 0; transform: translateY(20px); text-align: center; padding: 0 20px; }

        /* رادار الترحيب الودود */
        #geo-welcome {
            position: fixed; top: 30px; left: -500px; z-index: 9999;
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(20px);
            border-left: 4px solid #fff; padding: 15px 30px; border-radius: 0 15px 15px 0;
            color: #fff; font-size: 18px; transition: 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #canvas-bg { position: absolute; top: 0; left: 0; z-index: 1; }
        #video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; transition: 3s; }
        iframe { width: 100vw; height: 100vh; transform: scale(1.6); border: none; pointer-events: none; }

        /* البطاقة الملكية */
        .royal-card {
            position: relative; z-index: 10; width: 400px;
            background: var(--glass); backdrop-filter: blur(50px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50px;
            padding: 60px 20px; text-align: center;
            opacity: 0; transform: scale(0.8); transition: 1.5s;
        }

        .avatar-frame {
            width: 170px; height: 170px; margin: 0 auto 25px auto;
            border: 2px solid #fff; border-radius: 50%; padding: 6px;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
        }
        /* تم إصلاح الرابط هنا */
        .avatar-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        h1 { font-family: 'Anek Malayalam', sans-serif; font-size: 40px; color: #fff; margin: 0; }
        .sub-name { font-family: 'Caveat', cursive; color: #aaa; font-size: 28px; margin-bottom: 30px; display: block; }

        .discord-btn {
            display: inline-block; padding: 18px 60px; background: #fff; color: #000;
            text-decoration: none; font-weight: 900; border-radius: 100px;
            font-size: 18px; transition: 0.4s; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }
        .discord-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px #fff; }

        .social-links {
            display: flex; justify-content: center; gap: 40px; margin-top: 40px;
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .social-links a { color: #fff; font-size: 32px; opacity: 0.6; transition: 0.3s; }
        .social-links a:hover { opacity: 1; transform: translateY(-5px); filter: drop-shadow(0 0 10px #fff); }

        .pulse-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50px; z-index: -1; opacity: 0;
            animation: pulseAnim 0.5s infinite alternate;
        }
        @keyframes pulseAnim { to { box-shadow: 0 0 120px rgba(255,255,255,0.25); } }
    </style>
</head>
<body style="display:flex; align-items:center; justify-content:center;">

    <div id="auto-welcome">
        <div class="loading-text" id="t1">مرحباً بك..</div>
        <div class="loading-text" id="t2" style="margin-top:15px; font-size:40px;">في مملكة حسن علي</div>
    </div>

    <div id="geo-welcome">
        <i class="fas fa-heart"></i> <span id="welcome-msg">أهلاً بك يا غالي..</span>
    </div>

    <div id="video-bg"><div id="player"></div></div>
    <canvas id="canvas-bg"></canvas>

    <div class="royal-card" id="main-card" data-tilt data-tilt-max="10">
        <div class="pulse-effect" id="aura"></div>
        <div class="avatar-frame">
            <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" alt="Hassan">
        </div>
        <h1>حسن علي الشمري</h1>
        <span class="sub-name"># ابن ساير</span>
        <a href="https://discord.gg/CTwKRt7u" class="discord-btn" target="_blank">انضم لسيرفري</a>
        <div class="social-links">
            <a href="https://www.instagram.com/76h16/?hl=ar" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@6r09" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <script>
        // إعداد اليوتيوب
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }

        // الدخول التلقائي
        window.addEventListener('load', () => {
            gsap.to("#t1", { opacity: 1, y: 0, duration: 1, delay: 0.5 });
            gsap.to("#t2", { opacity: 1, y: 0, duration: 1, delay: 1.2 });

            // الترحيب الصوتي
            setTimeout(() => {
                let speech = new SpeechSynthesisUtterance("أهلاً بك.. نورت عالم حسن علي الشمري، ابن ساير.");
                speech.lang = 'ar-SA';
                window.speechSynthesis.speak(speech);
            }, 800);

            // الانتقال بعد 5 ثواني
            setTimeout(() => {
                const welcome = document.getElementById('auto-welcome');
                welcome.style.opacity = '0';
                setTimeout(() => {
                    welcome.style.display = 'none';
                    gsap.to("#main-card", { opacity: 1, scale: 1, duration: 1.5 });
                    document.getElementById('video-bg').style.opacity = '0.35';
                    if (player) { player.unMute(); player.setVolume(100); }
                    document.getElementById('aura').style.opacity = '1';
                    fetchLocation();
                }, 1000);
            }, 5000);
        });

        function fetchLocation() {
            fetch('https://get.geojs.io/v1/ip/geo.json').then(res => res.json()).then(data => {
                document.getElementById('welcome-msg').innerText = `أهلاً بك يا غالي من ${data.country}، نورتنا!`;
                document.getElementById('geo-welcome').style.left = '0';
            });
        }

        // النجوم
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const geo = new THREE.BufferGeometry(); const pos = [];
        for(let i=0; i<3000; i++) pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xffffff, size: 2.5}));
        scene.add(pts); camera.position.z = 500;
        function anim() { requestAnimationFrame(anim); pts.rotation.y += 0.0008; renderer.render(scene, camera); }
        anim();
        window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
