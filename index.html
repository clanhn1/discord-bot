<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERAS IS HERE | ACCESS DENIED</title>
    <style>
        /* --- الألوان والخطوط الفخمة --- */
        :root {
            --bg-color: #050505;
            --main-accent: #ff0000; /* أحمر التحذير */
            --secondary-accent: #8e44ad; /* بنفسجي غامض */
            --text-color: #f1f1f1;
            --font-main: 'Courier New', Courier, monospace; /* خط الهاكر الكلاسيكي */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* --- خلفية متحركة فاخرة (تأثير الشبكة) --- */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #1a1a1a 1px, rgba(0,0,0,0) 1px);
            background-size: 30px 30px;
            z-index: -1;
            opacity: 0.3;
        }

        /* --- تأثير الأفاتار المركزي --- */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--secondary-accent);
            box-shadow: 0 0 30px var(--secondary-accent), inset 0 0 20px rgba(142, 68, 173, 0.5);
            transition: transform 0.3s ease-out;
        }

        .avatar-container:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- العناوين والتأثيرات الصوتية --- */
        h1 {
            font-size: 2.5em;
            color: var(--main-accent);
            text-shadow: 0 0 10px var(--main-accent), 0 0 20px var(--main-accent);
            margin: 0;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        .status-text {
            color: var(--text-color);
            margin: 15px 0 40px 0;
            font-size: 1.2em;
            opacity: 0.8;
            height: 1.5em; /* للحفاظ على الارتفاع أثناء التأثير */
        }

        /* --- زر الديسكورد الفاخر (رابط السيرفر) --- */
        .discord-btn {
            background: linear-gradient(45deg, #1e1e1e, #0a0a0a);
            color: var(--text-color);
            border: 2px solid var(--main-accent);
            padding: 18px 40px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }

        .discord-btn:hover {
            color: #fff;
            background: var(--main-accent);
            box-shadow: 0 0 40px var(--main-accent);
            transform: translateY(-3px);
        }

        .discord-btn::before {
            content: '>';
            position: absolute;
            left: 15px;
            opacity: 0;
            transition: 0.3s;
        }

        .discord-btn:hover::before {
            opacity: 1;
            left: 20px;
        }

        /* --- رسالة النهاية العربي --- */
        .ara-text {
            margin-top: 50px;
            color: var(--secondary-accent);
            font-size: 1.1em;
            font-weight: bold;
            text-shadow: 0 0 5px var(--secondary-accent);
        }

        /* --- الحركات (Animations) --- */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ستارة التحميل للتفاعل وتشغيل الصوت */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            font-size: 2em;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        اضغط في أي مكان لبدء البروتوكول...
    </div>

    <div id="particles-js"></div>

    <div class="main-content" style="opacity: 0; transition: opacity 2s;">
        
        <div class="avatar-container">
            <img src="https://images.discordapp.net/avatars/452800723646677002/097a9f7e44a47895f329240801833878.png?size=256" alt="Feras" id="userAvatar">
        </div>

        <h1>SYSTEM BY FERAS</h1>

        <div class="status-text" id="status">جاري الاتصال بقاعدة البيانات...</div>

        <a href="https://discord.gg/CTwKRt7u" class="discord-btn" target="_blank">
            انضم إلى المملكة
        </a>

        <div class="ara-text">
            جاكم فراس ي وقع انت وياه
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
        متصفحك لا يدعم الصوت.
    </audio>

    <script>
        // دالة تشغيل التجربة (الصوت + الأنيميشن)
        function startExperience() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelector('.main-content').style.opacity = '1';
            
            // تشغيل الصوت (نحتاج لتفاعل المستخدم أولاً)
            var audio = document.getElementById("bgMusic");
            audio.play().catch(error => {
                console.log("الاصوات معطلة في المتصفح. نحتاج لتفاعل حقيقي.");
            });

            // بدء تأثير الكتابة
            startTyping();
        }

        // تأثير الكتابة
        function startTyping() {
            const textArray = ["بروتوكول الوصول: نشط", "سيرفر الديسكورد: جاهز", "الهدف: الاتصال بـ فراس"];
            const statusElement = document.getElementById('status');
            let arrayIndex = 0;
            let charIndex = 0;

            function type() {
                if (charIndex < textArray[arrayIndex].length) {
                    statusElement.innerHTML += textArray[arrayIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 100); // سرعة الكتابة
                } else {
                    setTimeout(erase, 2000); // وقت التوقف قبل المسح
                }
            }

            function erase() {
                if (charIndex > 0) {
                    statusElement.innerHTML = textArray[arrayIndex].substring(0, charIndex-1);
                    charIndex--;
                    setTimeout(erase, 50); // سرعة المسح
                } else {
                    arrayIndex = (arrayIndex + 1) % textArray.length;
                    setTimeout(type, 1000); // وقت التوقف قبل الجملة التالية
                }
            }

            type(); // البدء
        }
    </script>
</body>
</html>
