<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN HUB | THE IRAQI DEVELOPER</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;800&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon: #ffffff;
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.03);
            --bg: #030303;
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: var(--bg); color: #fff; font-family: 'Changa', sans-serif;
            overflow: hidden;
        }

        /* علم العراق المتحرك */
        #iraq-flag {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.1); padding: 10px 20px;
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); animation: float 3s infinite ease-in-out;
        }
        .flag-wave {
            width: 40px; height: 25px; background: linear-gradient(to bottom, #ff0000 33%, #ffffff 33% 66%, #000000 66%);
            position: relative; border-radius: 3px; overflow: hidden;
        }
        .flag-wave::after { content: "الله أكبر"; color: green; font-size: 6px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* الشاشة الرئيسية - القائمة الكاملة */
        #main-wrapper {
            position: relative; z-index: 100; width: 95%; height: 90vh;
            margin: 5vh auto; background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        /* الهيدر العلوي الفخم */
        nav {
            padding: 20px 50px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-links { display: flex; gap: 30px; }
        .nav-links div {
            cursor: pointer; font-weight: 800; font-family: 'Orbitron';
            letter-spacing: 2px; opacity: 0.6; transition: 0.3s;
        }
        .nav-links div:hover, .nav-links div.active { opacity: 1; color: var(--accent); text-shadow: 0 0 15px var(--accent); }

        /* منطقة المحتوى */
        .content-area { flex: 1; padding: 40px; overflow-y: auto; }
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; animation: fadeInUp 0.8s ease;
        }

        /* كرت السكربت المتطور */
        .script-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; padding: 30px; position: relative; transition: 0.4s;
        }
        .script-card:hover { transform: translateY(-10px); border-color: var(--accent); background: rgba(0,210,255,0.05); }
        .card-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-copy { background: #fff; color: #000; }
        .btn-delete { background: #ff4b4b; color: #fff; display: none; } /* يظهر للمطور فقط */

        /* لوحة التحكم (المطور) */
        .admin-section {
            background: rgba(255,255,255,0.05); padding: 30px; border-radius: 25px;
            margin-bottom: 40px; border: 1px dashed var(--accent);
        }
        .admin-input {
            background: #000; border: 1px solid #333; color: #fff;
            padding: 15px; border-radius: 12px; width: 100%; margin-bottom: 15px; outline: none;
        }

        /* التحكم في الصوت */
        .audio-hub {
            position: fixed; bottom: 30px; right: 30px; z-index: 1001;
            background: rgba(0,0,0,0.5); padding: 10px 25px; border-radius: 100px;
            display: flex; align-items: center; gap: 15px; border: 1px solid var(--accent);
        }
        input[type=range] { width: 100px; accent-color: var(--accent); cursor: pointer; }

        #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.2; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="iraq-flag">
        <div class="flag-wave"></div>
        <div style="font-size: 14px; font-weight: 900;">المطور حسن | IRAQ</div>
    </div>

    <div id="video-bg"><div id="player"></div></div>
    <canvas id="starfield"></canvas>

    <div id="main-wrapper">
        <nav>
            <div style="display:flex; align-items:center; gap:15px;">
                <img id="profile-pic" src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" style="width:50px; height:50px; border-radius:50%; border:2px solid #fff;">
                <h2 style="font-family:'Orbitron'; margin:0;">HASSAN HUB</h2>
            </div>
            <div class="nav-links">
                <div class="active" onclick="switchTab('store', this)">المتجر</div>
                <div onclick="switchTab('apps', this)">التطبيقات</div>
                <div onclick="switchTab('admin', this)">لوحة التحكم</div>
                <div onclick="switchTab('logs', this)">الرصد</div>
            </div>
        </nav>

        <div class="content-area">
            <section id="tab-store" class="tab-content">
                <h1 style="text-align:center; font-size:40px; margin-bottom:40px;">أقوى السكربتات العالمية 💎</h1>
                <div class="grid-container" id="scripts-list">
                    </div>
            </section>

            <section id="tab-apps" class="tab-content" style="display:none;">
                <h1 style="text-align:center; font-size:40px; margin-bottom:40px;">مركز التطبيقات المعدلة 📱</h1>
                <div class="grid-container" id="apps-list">
                    </div>
            </section>

            <section id="tab-admin" class="tab-content" style="display:none;">
                <div class="admin-section">
                    <h2>إضافة محتوى جديد (سكربت/تطبيق)</h2>
                    <input type="text" id="new-title" class="admin-input" placeholder="عنوان العمل...">
                    <textarea id="new-desc" class="admin-input" style="height:100px;" placeholder="وصف العمل..."></textarea>
                    <input type="text" id="new-link" class="admin-input" placeholder="الرابط أو الكود...">
                    <select id="new-type" class="admin-input">
                        <option value="script">سكربت</option>
                        <option value="app">تطبيق</option>
                    </select>
                    <button class="btn" style="background:var(--accent); color:#000; width:100%;" onclick="addItem()">نشر الآن</button>
                </div>
            </section>

            <section id="tab-logs" class="tab-content" style="display:none;">
                <h2>سجل الزوار والمرصد الذكي</h2>
                <div id="ip-table" style="background:rgba(0,0,0,0.5); padding:20px; border-radius:20px; font-family:monospace; color:#0f0;">
                    [System] جاري سحب البيانات...
                </div>
            </section>
        </div>
    </div>

    <div class="audio-hub">
        <i class="fas fa-music"></i>
        <input type="range" id="vol" min="0" max="100" value="20">
        <i class="fas fa-volume-down"></i>
    </div>

    <script>
        // --- إدارة المحتوى (تعديل مستمر) ---
        let items = JSON.parse(localStorage.getItem('hassan_items')) || [
            {id: 1, title: 'Roblox Admin V4', desc: 'أفضل سكربت إدمن شامل بجميع الميزات.', link: 'loadstring(game:HttpGet("..."))()', type: 'script'},
            {id: 2, title: 'Elite Executor', desc: 'تطبيق حاقن سريع جداً وخفيف.', link: 'https://download.com', type: 'app'}
        ];

        function renderItems() {
            const sList = document.getElementById('scripts-list');
            const aList = document.getElementById('apps-list');
            sList.innerHTML = ''; aList.innerHTML = '';

            items.forEach(item => {
                const html = `
                    <div class="script-card">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                        <div class="card-actions">
                            <button class="btn btn-copy" onclick="copyAction('${item.link}')">${item.type === 'script' ? 'نسخ الكود' : 'تحميل الآن'}</button>
                            <button class="btn btn-delete" style="display:block" onclick="deleteItem(${item.id})">حذف</button>
                        </div>
                    </div>
                `;
                if(item.type === 'script') sList.innerHTML += html;
                else aList.innerHTML += html;
            });
            localStorage.setItem('hassan_items', JSON.stringify(items));
        }

        function addItem() {
            const title = document.getElementById('new-title').value;
            const desc = document.getElementById('new-desc').value;
            const link = document.getElementById('new-link').value;
            const type = document.getElementById('new-type').value;

            if(title && link) {
                items.push({id: Date.now(), title, desc, link, type});
                renderItems();
                alert("تمت الإضافة بنجاح!");
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            renderItems();
        }

        function copyAction(text) {
            navigator.clipboard.writeText(text);
            alert("تم النسخ بنجاح!");
        }

        // --- نظام التبويبات ---
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-links div').forEach(d => d.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'block';
            btn.classList.add('active');
        }

        // --- اليوتيوب والموسيقى ---
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }
        document.getElementById('vol').addEventListener('input', (e) => {
            if(player) { player.unMute(); player.setVolume(e.target.value); }
        });

        // --- الرصد الذكي ---
        async function fetchIP() {
            const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
            const data = await res.json();
            const logBox = document.getElementById('ip-table');
            logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] رصد دخول من: ${data.country} | IP: ${data.ip}`;
        }

        // --- نجوم الخلفية ---
        const sc = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const rd = new THREE.WebGLRenderer({ canvas: document.getElementById('starfield'), alpha: true });
        rd.setSize(window.innerWidth, window.innerHeight);
        const stGeo = new THREE.BufferGeometry(); const stPos = [];
        for(let i=0; i<5000; i++) stPos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        stGeo.setAttribute('position', new THREE.Float32BufferAttribute(stPos, 3));
        const stars = new THREE.Points(stGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2}));
        sc.add(stars); cam.position.z = 1;
        function anim() { requestAnimationFrame(anim); stars.rotation.y += 0.001; rd.render(sc, cam); }
        
        window.onload = () => {
            renderItems();
            fetchIP();
            anim();
            // ترحيب صوتي ملكي
            setTimeout(() => {
                let s = new SpeechSynthesisUtterance("أهلاً بك في منصة المطور حسن العراقي. تم تحميل النظام بنجاح.");
                s.lang = 'ar-SA'; window.speechSynthesis.speak(s);
            }, 1000);
        };
    </script>
</body>
</html>
