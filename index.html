<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسن علي الشمري | الإمبراطورية</title>
    <style>
        :root {
            --neon-color: #00f3ff;
            --neon-secondary: #bc13fe;
            --glass-bg: rgba(10, 10, 10, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #000000 100%);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        /* --- شاشة الدخول (لتفعيل الموسيقى) --- */
        #enter-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 1s ease-out;
        }

        .enter-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: var(--neon-color);
            background: var(--glass-bg);
            border: 1px solid var(--neon-color);
            box-shadow: 0 0 15px var(--neon-color), inset 0 0 10px var(--neon-color);
            border-radius: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-color);
            animation: pulse 1.5s infinite alternate;
        }

        /* --- البطاقة الزجاجية في المنتصف --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(188, 19, 254, 0.2);
            opacity: 0;
            transform: scale(0.9);
            transition: all 1s ease-out;
            position: relative;
        }

        .glass-panel.active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- الأفاتار النيون --- */
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid var(--neon-color);
            box-shadow: 0 0 30px var(--neon-color), inset 0 0 20px var(--neon-color);
            margin: 0 auto 25px auto;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .avatar:hover {
            transform: scale(1.08) rotate(5deg);
            box-shadow: 0 0 50px var(--neon-secondary);
            border-color: var(--neon-secondary);
        }

        /* --- العبارات الفخمة --- */
        h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-color);
            letter-spacing: 1px;
        }

        .luxury-phrase {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 35px;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        .highlight {
            color: var(--neon-secondary);
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-secondary);
        }

        /* --- زر السيرفر --- */
        .discord-btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 18px;
            color: #fff;
            background: transparent;
            border: 2px solid var(--neon-secondary);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }

        .discord-btn:hover {
            background: var(--neon-secondary);
            color: #fff;
            box-shadow: 0 0 40px var(--neon-secondary), 0 0 20px var(--neon-secondary);
            transform: translateY(-3px);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--neon-color); }
            100% { box-shadow: 0 0 30px var(--neon-color), inset 0 0 15px var(--neon-color); }
        }
    </style>
</head>
<body>

    <div id="enter-screen" onclick="enterRealm()">
        <div class="enter-btn">اضغط للدخول إلى عالم الأساطير</div>
    </div>

    <div class="glass-panel" id="mainCard">
        
        <img src="ضع_رابط_صورتك_هنا.jpg" alt="Hassan Avatar" class="avatar">
        
        <h1>حسن علي الشمري</h1>
        
        <p class="luxury-phrase">
            القمة لا تتسع إلا لمن صنعها...<br>
            <span class="highlight">السيطرة التامة تبدأ من هنا</span>
        </p>

        <a href="https://discord.gg/CTwKRt7u" class="discord-btn" target="_blank">
            اقتحم الإمبراطورية
        </a>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        function enterRealm() {
            // إخفاء شاشة الدخول
            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 1000);

            // إظهار البطاقة الفخمة
            const mainCard = document.getElementById('mainCard');
            setTimeout(() => {
                mainCard.classList.add('active');
            }, 500);

            // تشغيل الأغنية
            const audio = document.getElementById("bgMusic");
            audio.volume = 0.5; // يمكنك تعديل مستوى الصوت من 0.0 إلى 1.0
            audio.play().catch(e => console.log("الصوت يحتاج لتفاعل إضافي من المتصفح"));
        }
    </script>
</body>
</html>
