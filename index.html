<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN ELITE STORE | المتجر الملكي</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --main-blue: #00d2ff; --main-purple: #9d50bb; --bg-dark: #050505; }
        body, html { margin: 0; padding: 0; background: var(--bg-dark); color: #fff; font-family: 'Changa', sans-serif; overflow-x: hidden; }

        /* شريط العلم العراقي العلوي */
        .top-bar {
            width: 100%; height: 5px;
            background: linear-gradient(90deg, #ff0000 33%, #ffffff 33% 66%, #000000 66%);
            position: fixed; top: 0; z-index: 2000;
        }

        /* الهيدر الاحترافي */
        header {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 5px; z-index: 1000;
        }
        .logo { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--main-blue); }

        /* شاشة الترحيب والإحصائيات */
        .hero { text-align: center; padding: 100px 20px; position: relative; z-index: 10; }
        .hero h1 { font-size: 60px; margin: 0; font-family: 'Orbitron'; text-shadow: 0 0 30px var(--main-blue); }
        .stats-container {
            display: flex; justify-content: center; gap: 50px; margin-top: 50px;
            background: rgba(255,255,255,0.02); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 35px; font-weight: 900; color: var(--main-blue); font-family: 'Orbitron'; }
        .stat-label { font-size: 14px; opacity: 0.6; }

        /* شبكة المنتجات */
        .container { width: 90%; max-width: 1200px; margin: 50px auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .card {
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); border-radius: 20px;
            overflow: hidden; transition: 0.4s; position: relative;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--main-blue); box-shadow: 0 0 30px rgba(0,210,255,0.2); }
        .card-img { width: 100%; height: 200px; background-size: cover; background-position: center; position: relative; }
        .card-img::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, #0a0a0a, transparent); }
        
        .card-content { padding: 25px; }
        .card-price { color: var(--main-blue); font-weight: 900; font-size: 20px; margin-bottom: 15px; display: block; }
        .card-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: #fff; color: #000; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .card-btn:hover { background: var(--main-blue); color: #fff; }

        /* لوحة التحكم الجانبية */
        #admin-toggle { position: fixed; bottom: 30px; left: 30px; z-index: 1001; background: #fff; color: #000; padding: 15px; border-radius: 50%; cursor: pointer; }
        #admin-panel {
            position: fixed; left: -400px; top: 0; width: 350px; height: 100%;
            background: #0f0f0f; z-index: 1002; transition: 0.5s; padding: 40px 20px;
            border-right: 1px solid var(--main-blue); overflow-y: auto;
        }
        #admin-panel.active { left: 0; }
        .admin-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar"></div>
    <canvas id="bg-canvas"></canvas>

    <header>
        <div class="logo"><i class="fas fa-shield-halved"></i> HASSAN STORE</div>
        <div style="display:flex; gap:20px;">
            <a href="#" style="color:#fff; text-decoration:none;">الرئيسية</a>
            <a href="#" style="color:#fff; text-decoration:none;">المنتجات</a>
            <a href="https://discord.gg/CTwKRt7u" target="_blank" style="color:var(--main-blue); text-decoration:none; font-weight:900;">ديسكورد</a>
        </div>
    </header>

    <div class="hero">
        <h1>Welcome to <span style="color:var(--main-blue)">HASSAN</span> Store</h1>
        <p>المتجر الأول في العراق لتطوير السكربتات والحسابات البريميوم</p>
        
        <div class="stats-container">
            <div class="stat-item"><span class="stat-val" id="sold-count">542</span><span class="stat-label">منتج مباع</span></div>
            <div class="stat-item"><span class="stat-val">120</span><span class="stat-label">عميل سعيد</span></div>
            <div class="stat-item"><span class="stat-val">4.9</span><span class="stat-label">متوسط التقييم</span></div>
        </div>
    </div>

    <div class="container">
        <div class="products-grid" id="main-grid">
            <div class="card">
                <div class="card-img" style="background-image: url('https://i.postimg.cc/9XdbK2pK/tnzyl.jpg');"></div>
                <div class="card-content">
                    <h3>Netflix Accounts</h3>
                    <span class="card-price">$2.50</span>
                    <button class="card-btn">شراء الآن</button>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-toggle" onclick="toggleAdmin()"><i class="fas fa-cog"></i></div>
    <div id="admin-panel">
        <h2 style="color:var(--main-blue)">إعدادات المطور حسن</h2>
        <hr style="opacity:0.1">
        <h4>إضافة منتج جديد</h4>
        <input type="text" id="p-title" class="admin-input" placeholder="اسم المنتج...">
        <input type="text" id="p-price" class="admin-input" placeholder="السعر (مثال: $5.00)">
        <input type="text" id="p-img" class="admin-input" placeholder="رابط صورة المنتج...">
        <button class="card-btn" style="background:var(--main-blue); color:#fff;" onclick="addNewProduct()">إضافة للمتجر</button>
        
        <h4 style="margin-top:40px;">إعدادات الموقع</h4>
        <input type="text" id="site-name" class="admin-input" placeholder="تغيير اسم المتجر...">
        <button class="card-btn" onclick="saveSiteName()">حفظ التعديلات</button>
    </div>

    <script>
        // نظام إضافة المنتجات وحفظها
        let products = JSON.parse(localStorage.getItem('hassan_store_data')) || [];

        function renderProducts() {
            const grid = document.getElementById('main-grid');
            // نبقي المنتج الأول كنموذج ونضيف البقية
            let html = `
                <div class="card">
                    <div class="card-img" style="background-image: url('https://i.postimg.cc/9XdbK2pK/tnzyl.jpg');"></div>
                    <div class="card-content">
                        <h3>Premium Script V4</h3>
                        <span class="card-price">$10.00</span>
                        <button class="card-btn">شراء الآن</button>
                    </div>
                </div>
            `;
            products.forEach((p, index) => {
                html += `
                    <div class="card">
                        <div class="card-img" style="background-image: url('${p.img}')"></div>
                        <div class="card-content">
                            <h3>${p.title}</h3>
                            <span class="card-price">${p.price}</span>
                            <button class="card-btn" onclick="deleteProduct(${index})" style="background:#ff4b4b; color:#fff; margin-bottom:5px;">حذف (للمطور)</button>
                            <button class="card-btn">شراء الآن</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function addNewProduct() {
            const title = document.getElementById('p-title').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            if(title && price && img) {
                products.push({title, price, img});
                localStorage.setItem('hassan_store_data', JSON.stringify(products));
                renderProducts();
                alert("تمت إضافة المنتج بنجاح!");
            }
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            localStorage.setItem('hassan_store_data', JSON.stringify(products));
            renderProducts();
        }

        function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('active'); }

        // تأثيرات الخلفية (Spider Web)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 500; i++) {
            vertices.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 2 });
        const points = new THREE.Points(geometry, material);
        scene.add(points);
        camera.position.z = 1000;

        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.onload = renderProducts;
    </script>
</body>
</html>
