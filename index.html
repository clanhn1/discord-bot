<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN ALI | 30nr</title>
    <style>
        :root {
            --main-red: #ff0000;
            --dark-red: #8b0000;
            --glass: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* فيديو اليوتيوب كخلفية */
        .video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.3; /* الشفافية للحفاظ على الفخامة */
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* شاشة الدخول */
        #enter-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 1s ease;
        }

        .enter-btn {
            color: var(--main-red);
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            border: 2px solid var(--main-red);
            border-radius: 5px;
            text-shadow: 0 0 15px var(--main-red);
            box-shadow: 0 0 20px var(--main-red), inset 0 0 10px var(--main-red);
            background: transparent;
            animation: pulse 1.5s infinite;
        }

        /* البطاقة الرئيسية */
        .main-card {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 15px;
            padding: 60px 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            transform: scale(0.8);
            opacity: 0;
            transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .main-card.active {
            transform: scale(1);
            opacity: 1;
        }

        /* الأفاتار */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--main-red);
            box-shadow: 0 0 30px var(--main-red);
            margin-bottom: 25px;
            object-fit: cover;
        }

        h1 {
            color: #fff;
            font-size: 35px;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--main-red);
            letter-spacing: 2px;
        }

        .tag {
            color: var(--main-red);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
            display: block;
        }

        .desc {
            color: #ccc;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* زر الديسكورد */
        .btn-join {
            background: transparent;
            color: #fff;
            border: 2px solid var(--main-red);
            padding: 15px 40px;
            font-size: 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.4s;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .btn-join:hover {
            background: var(--main-red);
            box-shadow: 0 0 40px var(--main-red);
            transform: translateY(-5px);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="enter-screen" onclick="launchExperience()">
        <div class="enter-btn">إضغط للإختراق</div>
        <p style="color: #444; margin-top: 20px;">HASSAN ALI AL-SHAMMARI</p>
    </div>

    <div class="video-background">
        <div id="player"></div>
    </div>

    <div class="main-card" id="card">
        <img src="https://cdn.discordapp.com/avatars/452800723646677002/097a9f7e44a47895f329240801833878.png?size=256" 
             onerror="this.src='https://i.imgur.com/A6S9fXz.png'" class="avatar">
        
        <h1>حسن علي الشمري</h1>
        <span class="tag">@30nr</span>

        <p class="desc">
            عمك هنا يابه.. <br>
            نورت المملكة، <span style="color: var(--main-red);">لا تحاول تقلد</span>.
        </p>

        <a href="https://discord.gg/CTwKRt7u" class="btn-join" target="_blank">انضم لسيرفري</a>
    </div>

    <script>
        // تحميل فيديو يوتيوب
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'RW7DcfTGdHk',
                    'mute': 0
                }
            });
        }

        function launchExperience() {
            // إخفاء الشاشة الأولى
            document.getElementById('enter-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('enter-screen').style.display = 'none';
                document.getElementById('card').classList.add('active');
            }, 1000);

            // تشغيل الفيديو والصوت
            if (player && player.playVideo) {
                player.playVideo();
                player.setVolume(100);
            }
        }
    </script>
</body>
</html>
