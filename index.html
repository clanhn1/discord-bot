<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | 30nr</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@800&family=Caveat:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --portal-glow: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; font-family: 'Poppins', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* بوابه الدخول الذكية */
        #portal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: 1.5s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .portal-ring {
            width: 220px; height: 220px;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.2), inset 0 0 60px rgba(255, 255, 255, 0.1);
            animation: portalRotate 4s infinite linear;
            display: flex; align-items: center; justify-content: center;
        }

        .portal-core {
            width: 100px; height: 100px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 80px #fff; animation: portalPulse 1.5s infinite alternate;
        }

        .portal-text {
            color: #fff; margin-top: 40px; font-size: 20px;
            letter-spacing: 8px; font-weight: bold; text-transform: uppercase;
            animation: textFade 2s infinite alternate;
        }

        /* البطاقة المركزية */
        .fixed-card {
            position: relative; z-index: 10; width: 420px;
            background: var(--glass); backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 45px; padding: 50px 30px; text-align: center;
            opacity: 0; transform: scale(0.9) translateY(20px);
            transition: 1.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .fixed-card.active { opacity: 1; transform: scale(1) translateY(0); }

        /* توهج الإيقاع (Bass Glow) */
        #visual-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 45px; z-index: -1; opacity: 0;
            box-shadow: 0 0 0px var(--portal-glow);
            transition: 0.3s linear;
        }

        .avatar-frame {
            width: 160px; height: 160px; margin: 0 auto 25px auto;
            border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; padding: 5px;
            box-shadow: 0 0 40px rgba(255,255,255,0.1);
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        h1 { font-family: 'Anek Malayalam', sans-serif; font-size: 40px; color: #fff; margin: 0; }
        .signature-tag { font-family: 'Caveat', cursive; color: #888; font-size: 28px; margin-bottom: 25px; display: block; }

        /* أزرار السوشيال ميديا في الأسفل */
        .social-footer {
            display: flex; justify-content: center; gap: 40px; margin-top: 35px;
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .social-footer a { color: #fff; opacity: 0.6; transition: 0.4s; }
        .social-footer a:hover { opacity: 1; transform: translateY(-5px); filter: drop-shadow(0 0 10px #fff); }

        /* الأنيميشن */
        @keyframes portalRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes portalPulse { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.1); opacity: 1; } }
        @keyframes textFade { from { opacity: 0.3; } to { opacity: 1; } }
        
        .beat-hit { animation: bassPulse 0.48s infinite alternate; }
        @keyframes bassPulse {
            to { box-shadow: 0 0 120px var(--portal-glow); transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div id="portal-overlay">
        <div class="portal-ring">
            <div class="portal-core"></div>
        </div>
        <div class="portal-text">HASSAN ALI</div>
        <div style="font-family: 'Caveat'; color: #444; margin-top: 15px; font-size: 22px;"># ابن ساير</div>
    </div>

    <div id="video-bg" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0; transition:3s;">
        <div id="player"></div>
    </div>
    <canvas id="canvas-bg" style="position:fixed; top:0; left:0; z-index:2; pointer-events:none;"></canvas>

    <div class="fixed-card" id="main-card">
        <div id="visual-glow"></div>
        
        <div class="avatar-frame">
            <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" class="avatar-img" alt="Hassan">
        </div>
        
        <h1>حسن علي الشمري</h1>
        <span class="signature-tag"># ابن ساير</span>

        <a href="https://discord.gg/CTwKRt7u" style="display:inline-block; padding:16px 55px; background:#fff; color:#000; text-decoration:none; font-weight:bold; border-radius:50px; transition:0.4s; font-size: 18px;">انضم للمملكة</a>

        <div class="social-footer">
            <a href="https://www.instagram.com/76h16/?hl=ar" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.tiktok.com/@6r09" target="_blank"><i data-lucide="tiktok"></i></a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }

        // الدخول التلقائي بعد 3 ثواني
        window.addEventListener('load', () => {
            setTimeout(() => {
                const overlay = document.getElementById('portal-overlay');
                overlay.style.opacity = '0';
                overlay.style.transform = 'scale(2)';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.getElementById('main-card').classList.add('active');
                    document.getElementById('video-bg').style.opacity = '0.3';
                    
                    if (player) {
                        player.unMute();
                        player.setVolume(100);
                    }
                    
                    // تفعيل توهج الإيقاع
                    setTimeout(() => {
                        const glow = document.getElementById('visual-glow');
                        glow.style.opacity = '1';
                        glow.classList.add('beat-hit');
                    }, 1000);
                }, 1000);
            }, 3000);
        });

        // Background Particles
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<3500; i++) pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const points = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xffffff, size: 2}));
        scene.add(points); camera.position.z = 500;
        function animate() { requestAnimationFrame(animate); points.rotation.y += 0.0008; renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
