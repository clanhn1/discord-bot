<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN ELITE OS | المنصة العظمى</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00f2ff; --iraq-red: #ff0000; --bg: #000000; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* شريط الهوية العراقية الفخم */
        .iraq-header { position: fixed; top: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--iraq-red) 33%, #fff 33% 66%, #000 66%); z-index: 5000; }

        /* شاشة التحميل الذكية */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s; }
        .boot-text { font-family: 'Orbitron'; color: var(--neon); letter-spacing: 5px; animation: blink 0.1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* الهيكل الرئيسي (Full Screen) */
        .glass-ui { position: relative; z-index: 100; width: 95%; min-height: 90vh; margin: 5vh auto; background: rgba(255,255,255,0.01); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.05); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 100px rgba(0,0,0,1); }

        /* التنقل العلوي */
        nav { padding: 30px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-items { display: flex; gap: 40px; font-weight: 800; font-family: 'Orbitron'; }
        .nav-link { cursor: pointer; opacity: 0.5; transition: 0.3s; position: relative; }
        .nav-link:hover, .nav-link.active { opacity: 1; color: var(--neon); text-shadow: 0 0 20px var(--neon); }

        /* منطقة المحتوى */
        .viewport { flex: 1; padding: 50px; overflow-y: auto; }
        .hero-section { text-align: center; margin-bottom: 80px; }
        .hero-section h1 { font-size: 80px; font-family: 'Orbitron'; margin: 0; background: linear-gradient(to bottom, #fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* كروت الهولوغرام */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        .hologram-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 30px; padding: 35px; position: relative; transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1); cursor: pointer; overflow: hidden; }
        .hologram-card:hover { transform: translateY(-15px) rotateX(10deg); border-color: var(--neon); box-shadow: 0 20px 50px rgba(0,242,255,0.1); }
        .hologram-card i { font-size: 40px; color: var(--neon); margin-bottom: 20px; }
        .free-badge { position: absolute; top: 20px; left: 20px; background: #00ff88; color: #000; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 900; }

        /* مشغل الموسيقى (Visualizer) */
        .music-bar { position: fixed; bottom: 40px; right: 40px; background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 100px; border: 1px solid var(--neon); display: flex; align-items: center; gap: 20px; z-index: 1000; backdrop-filter: blur(10px); }
        .wave-container { display: flex; align-items: center; gap: 4px; height: 30px; }
        .wave-bar { width: 3px; height: 10px; background: var(--neon); animation: musicWave 0.8s infinite alternate; }

        @keyframes musicWave { from { height: 5px; } to { height: 30px; } }

        /* خلفية المصفوفة */
        canvas#matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }
    </style>
</head>
<body>

    <div class="iraq-header"></div>
    <canvas id="matrix"></canvas>
    <canvas id="stars"></canvas>

    <div id="boot-screen">
        <div class="boot-text">HASSAN_SYSTEM_BOOTING_V4.0</div>
        <div id="progress" style="width: 200px; height: 2px; background: #222; margin-top: 20px; position: relative; overflow: hidden;">
            <div id="bar" style="position: absolute; width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--neon);"></div>
        </div>
    </div>

    <div class="glass-ui">
        <nav>
            <div style="display:flex; align-items:center; gap:15px;">
                <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" style="width:55px; height:55px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 20px var(--neon);">
                <div>
                    <div style="font-weight:900; font-size:18px; font-family:'Orbitron';">HASSAN ALI</div>
                    <div style="font-size:10px; color:var(--neon);">[ IRAQI DEVELOPER ]</div>
                </div>
            </div>
            <div class="nav-items">
                <div class="nav-link active" onclick="showTab('scripts')">السكربتات المجانية</div>
                <div class="nav-link" onclick="showTab('apps')">التطبيقات المجانية</div>
                <div class="nav-link" onclick="showTab('upload')">مركز الرفع</div>
            </div>
        </nav>

        <main class="viewport">
            <div class="hero-section">
                <h1>FREE <span style="color:var(--neon)">MATRIX</span></h1>
                <p style="font-size:22px; color:#888;">كل شيء هنا مجاني بالكامل للأبد. من تطوير حسن علي الشمري.</p>
            </div>

            <section id="scripts" class="tab-content">
                <div class="card-grid" id="script-list">
                    </div>
            </section>

            <section id="upload" class="tab-content" style="display:none; text-align:center;">
                <div style="border: 2px dashed var(--neon); padding: 80px; border-radius: 40px; background: rgba(0,242,255,0.01);">
                    <i class="fas fa-terminal" style="font-size:60px; color:var(--neon); margin-bottom:30px;"></i>
                    <h2>نظام رفع الأكواد المشفر</h2>
                    <p>اسحب ملف السكربت هنا ليتم رفعه إلى سحابة حسن البرمجية.</p>
                    <button class="nav-link active" style="background:none; border:1px solid var(--neon); padding:15px 40px; border-radius:10px; margin-top:20px;">ابدأ الرفع الآن</button>
                </div>
            </section>
        </main>
    </div>

    <div class="music-bar">
        <div class="wave-container">
            <div class="wave-bar"></div><div class="wave-bar" style="animation-delay:0.2s"></div><div class="wave-bar" style="animation-delay:0.4s"></div>
        </div>
        <div style="font-family:'Orbitron'; font-size:12px;">HASSAN_RADIO_24/7</div>
        <i class="fas fa-play" id="m-btn" style="cursor:pointer; color:var(--neon);" onclick="mToggle()"></i>
    </div>

    <script>
        // --- إدارة المحتوى المجاني ---
        const data = [
            {title: "Auto Farm V4", type: "script", icon: "fa-code"},
            {title: "Admin GUI", type: "script", icon: "fa-user-shield"},
            {title: "Hassan Executor", type: "app", icon: "fa-mobile-alt"},
            {title: "Discord Bot Lite", type: "app", icon: "fa-robot"}
        ];

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            renderCards(id === 'scripts' ? 'script' : 'app');
        }

        function renderCards(filter) {
            const list = document.getElementById('script-list');
            list.innerHTML = '';
            data.filter(d => d.type === filter).forEach(item => {
                list.innerHTML += `
                    <div class="hologram-card">
                        <span class="free-badge">مجاني</span>
                        <i class="fas ${item.icon}"></i>
                        <h3 style="font-family:'Orbitron'">${item.title}</h3>
                        <p style="opacity:0.5; font-size:14px;">سكربت معالج بالكامل، يعمل بنسبة 100% بدون أي أخطاء برمجية.</p>
                        <button style="width:100%; padding:12px; background:#fff; color:#000; border:none; border-radius:10px; font-weight:900; margin-top:20px; cursor:pointer;">نسخ الرابط</button>
                    </div>
                `;
            });
        }

        // --- تأثيرات المصفوفة (Matrix) ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2ff"; ctx.font = fontSize + "px arial";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 33);

        // --- نظام الإقلاع ---
        window.onload = () => {
            renderCards('script');
            let p = 0;
            const interval = setInterval(() => {
                p += 2;
                document.getElementById('bar').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    gsap.to("#boot-screen", { opacity: 0, scale: 2, duration: 1, onComplete: () => document.getElementById('boot-screen').style.display='none' });
                    // ترحيب صوتي عراقي فخم
                    setTimeout(() => {
                        let msg = new SpeechSynthesisUtterance("تم تشغيل نظام حسن علي. جميع السكربتات جاهزة للاستخدام المجاني.");
                        msg.lang = 'ar-SA'; window.speechSynthesis.speak(msg);
                    }, 500);
                }
            }, 30);
        };
    </script>
</body>
</html>
