<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | THE EMPEROR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@800&family=Caveat:wght@700&family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --glow: rgba(255, 255, 255, 0.5);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #020202; font-family: 'Poppins', sans-serif;
            overflow: hidden; cursor: none; /* إخفاء الماوس العادي للمرافق الذكي */
        }

        /* المرافق الذكي (AI Cursor) */
        .ai-cursor {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; z-index: 99999;
            pointer-events: none; mix-blend-mode: difference;
            box-shadow: 0 0 20px #fff, 0 0 40px #fff;
            transform: translate(-50%, -50%);
        }
        .ai-cursor-trail {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px;
            border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; z-index: 99998;
            pointer-events: none; transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        /* شاشة الإقلاع الذكية */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: 1.5s cubic-bezier(0.85, 0, 0.15, 1);
        }
        .ai-text {
            color: #0f0; font-family: monospace; font-size: 14px;
            position: absolute; top: 20px; left: 20px; text-align: left; opacity: 0.7;
        }
        .boot-btn {
            color: #fff; font-size: 24px; letter-spacing: 15px; text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.3); padding: 20px 50px;
            cursor: pointer; transition: 0.4s; position: relative; overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.1); border-radius: 5px;
        }
        .boot-btn:hover { background: #fff; color: #000; letter-spacing: 20px; box-shadow: 0 0 50px #fff; }

        /* حاويات الخلفية */
        #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; transition: 2s; }
        iframe { width: 100%; height: 100%; pointer-events: none; transform: scale(1.5); }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }

        /* البطاقة المركزية */
        .glass-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 10; width: 420px;
            background: var(--glass); backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 40px;
            padding: 50px 30px; text-align: center;
            opacity: 0; transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .glass-panel.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* توهج الإيقاع */
        #ai-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 40px; z-index: -1; opacity: 0;
            box-shadow: 0 0 0px var(--glow); transition: 0.1s linear;
        }

        /* الصورة وتنسيقها */
        .img-ring {
            width: 160px; height: 160px; margin: 0 auto 25px auto;
            border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; padding: 5px;
            box-shadow: 0 0 40px rgba(255,255,255,0.2); position: relative;
        }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        h1 { font-family: 'Anek Malayalam', sans-serif; font-size: 42px; color: #fff; margin: 0; letter-spacing: 2px; }
        .tagline { font-family: 'Caveat', cursive; color: #aaa; font-size: 28px; margin-bottom: 30px; display: block; }

        .join-btn {
            display: inline-block; padding: 18px 60px; background: #fff; color: #000;
            text-decoration: none; font-weight: 900; border-radius: 100px;
            font-size: 18px; transition: 0.4s; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }
        .join-btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 50px #fff; }

        /* السوشيال ميديا في الأسفل */
        .socials {
            display: flex; justify-content: center; gap: 40px; margin-top: 35px;
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .socials a { color: #fff; opacity: 0.5; transition: 0.4s; }
        .socials a:hover { opacity: 1; transform: translateY(-5px) scale(1.2); filter: drop-shadow(0 0 15px #fff); }

        /* النبض المتزامن */
        .bass-drop { animation: bassReact 0.48s infinite alternate ease-in-out; }
        @keyframes bassReact { to { box-shadow: 0 0 120px var(--glow); } }
    </style>
</head>
<body>

    <div class="ai-cursor"></div>
    <div class="ai-cursor-trail"></div>

    <div id="boot-screen">
        <div class="ai-text" id="terminal">Initializing System...<br>Loading Core AI...</div>
        <div class="boot-btn" onclick="initializeAI()">ENTER SYSTEM</div>
    </div>

    <div id="video-bg"><div id="player"></div></div>
    
    <canvas id="canvas-bg"></canvas>

    <div class="glass-panel" id="card">
        <div id="ai-glow"></div>
        
        <div class="img-ring">
            <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" class="profile-pic" alt="Hassan">
        </div>
        
        <h1>حسن علي الشمري</h1>
        <span class="tagline"># ابن ساير</span>

        <a href="https://discord.gg/CTwKRt7u" class="join-btn" target="_blank">انضم للمملكة</a>

        <div class="socials">
            <a href="https://www.instagram.com/76h16/?hl=ar" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.tiktok.com/@6r09" target="_blank"><i data-lucide="tiktok"></i></a>
        </div>
    </div>

    <script>
        // تفعيل أيقونات Lucide
        lucide.createIcons();

        // 1. نظام الماوس الذكي (GSAP AI Cursor)
        const cursor = document.querySelector('.ai-cursor');
        const trail = document.querySelector('.ai-cursor-trail');
        
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
            gsap.to(trail, { x: e.clientX, y: e.clientY, duration: 0.5, ease: "power2.out" });
        });
        
        // تفاعل الماوس مع الزر
        document.querySelectorAll('a, .boot-btn').forEach(el => {
            el.addEventListener('mouseenter', () => { gsap.to(trail, { width: 60, height: 60, borderColor: '#fff' }); });
            el.addEventListener('mouseleave', () => { gsap.to(trail, { width: 40, height: 40, borderColor: 'rgba(255,255,255,0.5)' }); });
        });

        // تأثير التيرمينال الوهمي
        let termText = "Initializing System...\nLoading AI Core...\nConnecting to Server...\nReady.";
        let i = 0;
        setInterval(() => {
            if(i < termText.length) {
                document.getElementById('terminal').innerHTML = termText.substring(0, i).replace(/\n/g, '<br>');
                i++;
            }
        }, 50);

        // 2. إعداد مشغل اليوتيوب
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }

        // 3. نظام التشغيل والتفعيل (Initialize AI)
        function initializeAI() {
            // نطق الذكاء الاصطناعي (AI Voice)
            try {
                let msg = new SpeechSynthesisUtterance("تم تفعيل النظام.. مرحباً بك في عالم حسن ابن ساير");
                msg.lang = 'ar-SA';
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            } catch(e) { console.log("Voice API not supported"); }

            // إخفاء شاشة الإقلاع
            const boot = document.getElementById('boot-screen');
            boot.style.transform = 'scale(2)'; boot.style.opacity = '0';
            
            setTimeout(() => {
                boot.style.display = 'none';
                document.getElementById('card').classList.add('active');
                document.getElementById('video-bg').style.opacity = '0.35';
                
                // تشغيل الصوت
                if (player) { player.unMute(); player.setVolume(100); }
                
                // تفعيل توهج الإيقاع بعد ثانية
                setTimeout(() => {
                    const glow = document.getElementById('ai-glow');
                    glow.style.opacity = '1'; glow.classList.add('bass-drop');
                }, 1000);
            }, 1000);
        }

        // 4. خلفية Three.js الذكية (تتفاعل مع حركة الماوس)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const geo = new THREE.BufferGeometry(); const pos = [];
        for(let i=0; i<4000; i++) pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const points = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xffffff, size: 2.5}));
        scene.add(points); camera.position.z = 500;

        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        function animate() { 
            requestAnimationFrame(animate); 
            points.rotation.y += 0.0005; 
            // تفاعل الكاميرا مع الماوس (Parallax)
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera); 
        }
        animate();
    </script>
</body>
</html>
