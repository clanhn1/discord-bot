<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | 30nr</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@800&family=Caveat:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --border-glow: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; font-family: 'Poppins', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* بوابه الدخول الفخمة */
        #gate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: 2s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .gate-title {
            color: #fff; font-size: 50px; font-family: 'Anek Malayalam';
            letter-spacing: 15px; text-shadow: 0 0 30px #fff;
            opacity: 0; animation: fadeInScale 2s forwards 0.5s;
        }

        .gate-sub {
            font-family: 'Caveat'; color: #444; font-size: 30px;
            margin-top: 10px; opacity: 0; animation: fadeInScale 2s forwards 1.2s;
        }

        /* المربع المركزي الثابت */
        .premium-card {
            position: relative; z-index: 10; width: 440px;
            background: var(--glass-bg); backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px); 
            border: 1px solid var(--border-glow);
            border-radius: 40px; padding: 60px 20px; text-align: center;
            opacity: 0; transform: scale(0.7); transition: 2.5s;
        }
        .premium-card.active { opacity: 1; transform: scale(1); }

        /* توهج الإيقاع الدائري */
        .beat-visualizer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 105%; height: 105%;
            border-radius: 45px; z-index: -1; opacity: 0;
            box-shadow: 0 0 0px var(--neon-white);
            transition: 0.2s;
        }

        .avatar-circle {
            width: 170px; height: 170px; margin: 0 auto 30px auto;
            border: 2px solid #fff; border-radius: 50%; padding: 6px;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        h1 { font-family: 'Anek Malayalam', sans-serif; font-size: 45px; color: #fff; margin: 0; }
        .signature-line { font-family: 'Caveat', cursive; color: #fff; font-size: 32px; display: block; margin-top: -5px; opacity: 0.6; }

        /* السوشيال ميديا (ترتيب جديد في الأسفل) */
        .social-footer {
            margin-top: 40px; display: flex; justify-content: center; gap: 50px;
            padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .social-footer a { color: #fff; opacity: 0.5; transition: 0.4s; transform: scale(1.2); }
        .social-footer a:hover { opacity: 1; transform: scale(1.5) translateY(-5px); text-shadow: 0 0 15px #fff; }

        .btn-action {
            display: inline-block; margin-top: 30px; padding: 18px 60px;
            background: #fff; color: #000; text-decoration: none;
            font-weight: 900; border-radius: 100px; transition: 0.5s;
            font-size: 20px; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }
        .btn-action:hover { transform: scale(1.1); box-shadow: 0 15px 60px #fff; }

        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .pulse-active { animation: musicPulse 0.48s infinite alternate ease-in-out; }
        @keyframes musicPulse { to { box-shadow: 0 0 130px rgba(255, 255, 255, 0.4); } }
    </style>
</head>
<body>

    <div id="gate-overlay">
        <div class="gate-title">HASSAN</div>
        <div class="gate-sub"># ابن ساير</div>
    </div>

    <div id="video-bg" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0; transition:3s;">
        <div id="player"></div>
    </div>
    <canvas id="canvas-bg" style="position:fixed; top:0; left:0; z-index:2; pointer-events:none;"></canvas>

    <div class="premium-card" id="main-card">
        <div class="beat-visualizer" id="glow-ring"></div>
        
        <div class="avatar-circle">
            <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" class="avatar-img" alt="Hassan">
        </div>
        
        <h1>حسن علي الشمري</h1>
        <span class="signature-line"># ابن ساير</span>

        <a href="https://discord.gg/CTwKRt7u" class="btn-action" target="_blank">انضم للمملكة</a>

        <div class="social-footer">
            <a href="https://www.instagram.com/76h16/?hl=ar" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.tiktok.com/@6r09" target="_blank"><i data-lucide="tiktok"></i></a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                const gate = document.getElementById('gate-overlay');
                gate.style.opacity = '0';
                gate.style.transform = 'scale(1.5)';
                
                setTimeout(() => {
                    gate.style.display = 'none';
                    document.getElementById('main-card').classList.add('active');
                    document.getElementById('video-bg').style.opacity = '0.35';
                    
                    if (player) {
                        player.unMute();
                        player.setVolume(100);
                    }
                    
                    setTimeout(() => {
                        document.getElementById('glow-ring').style.opacity = '1';
                        document.getElementById('glow-ring').classList.add('pulse-active');
                    }, 1000);
                }, 1200);
            }, 3000); // 3 ثواني دخولية
        });

        // Background Particles
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<3000; i++) pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const points = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xffffff, size: 2.5}));
        scene.add(points); camera.position.z = 500;
        function animate() { requestAnimationFrame(animate); points.rotation.y += 0.0007; renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
