<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AI HUB | المطور حسن</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon-ai: #00f2ff; --free-green: #00ff88; --bg: #020202; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; overflow-x: hidden; }

        /* العلم العراقي المتحرك في الخلفية */
        .iraq-line { position: fixed; top: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #ff0000 33%, #fff 33% 66%, #000 66%); z-index: 3000; }

        /* نواة الذكاء الاصطناعي (AI Core) */
        #ai-container { width: 100%; height: 400px; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 50px; }
        .ai-status-box { position: absolute; bottom: 10px; background: rgba(0,242,255,0.1); padding: 10px 25px; border-radius: 50px; border: 1px solid var(--neon-ai); font-family: 'Orbitron'; font-size: 14px; box-shadow: 0 0 20px rgba(0,242,255,0.3); }

        /* الأقسام (مدفوع / مجاني) */
        .tab-system { display: flex; justify-content: center; gap: 20px; margin: 40px 0; }
        .tab-btn { padding: 15px 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.4s; font-weight: 800; background: rgba(255,255,255,0.02); }
        .tab-btn.active-premium { border-color: var(--neon-ai); color: var(--neon-ai); box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        .tab-btn.active-free { border-color: var(--free-green); color: var(--free-green); box-shadow: 0 0 20px rgba(0,255,136,0.2); }

        /* كروت المنتجات */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 0 5%; }
        .neon-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 30px; padding: 30px; transition: 0.5s; position: relative; overflow: hidden; }
        .neon-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent); transform: translateX(-100%); transition: 0.6s; }
        .neon-card:hover::before { transform: translateX(100%); }
        .neon-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--neon-ai); }
        .free-tag { position: absolute; top: 20px; right: 20px; background: var(--free-green); color: #000; padding: 5px 15px; border-radius: 50px; font-weight: 900; font-size: 12px; }

        /* مشغل الموسيقى */
        .music-player { position: fixed; bottom: 30px; left: 30px; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--neon-ai); display: flex; align-items: center; gap: 15px; }
        .visualizer { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .bar { width: 3px; background: var(--neon-ai); animation: wave 0.5s infinite alternate; }
        @keyframes wave { from { height: 5px; } to { height: 20px; } }

        /* رفع الملفات الفخم */
        .upload-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 30px; padding: 50px; text-align: center; margin-top: 50px; transition: 0.3s; cursor: pointer; }
        .upload-zone:hover { border-color: var(--neon-ai); background: rgba(0,242,255,0.02); }

        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>

    <div class="iraq-line"></div>
    <canvas id="bg-stars"></canvas>

    <header style="padding: 30px 5%; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-family: 'Orbitron'; font-size: 28px; font-weight: 900; letter-spacing: 3px;">HASSAN<span style="color:var(--neon-ai)">.AI</span></div>
        <div style="display: flex; gap: 30px; font-weight: 800;">
            <span style="cursor:pointer">المتجر</span>
            <span style="cursor:pointer">المجانيات</span>
            <span style="color:var(--neon-ai); cursor:pointer">لوحة المطور</span>
        </div>
    </header>

    <div id="ai-container">
        <div id="neural-sphere"></div>
        <div class="ai-status-box" id="ai-msg">AI CORE: WAITING FOR COMMAND...</div>
    </div>

    <div class="tab-system">
        <div class="tab-btn active-premium" onclick="showType('premium', this)">المنتجات المميزة</div>
        <div class="tab-btn" onclick="showType('free', this)">السكربتات المجانية</div>
    </div>

    <div class="grid" id="items-grid">
        </div>

    <div class="container" style="width: 90%; margin: 100px auto;">
        <h2 style="font-family:'Orbitron'">CLOUD UPLOAD SYSTEM</h2>
        <div class="upload-zone" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 50px; color: var(--neon-ai); margin-bottom: 20px;"></i>
            <h3>اسحب السكربت أو اضغط للرفع</h3>
            <p style="opacity: 0.5;">النظام سيقوم بتشفير الملف ورفعه إلى سيرفرات حسن الخاصة</p>
            <input type="file" id="file-input" style="display:none">
        </div>
    </div>

    <div class="music-player">
        <div class="visualizer">
            <div class="bar"></div><div class="bar" style="animation-delay:0.2s"></div><div class="bar" style="animation-delay:0.4s"></div>
        </div>
        <div style="font-size: 14px;">PROMISES - CHILL MIX</div>
        <i class="fas fa-play" id="play-toggle" style="cursor:pointer; color:var(--neon-ai)" onclick="toggleMusic()"></i>
        <input type="range" id="vol" min="0" max="100" value="30" style="width: 80px; accent-color: var(--neon-ai);">
    </div>

    <script>
        // --- بيانات المنتجات ---
        const products = [
            {title: "Admin Panel V4", price: "$15.00", type: "premium", img: ""},
            {title: "Auto Farm Script", price: "FREE", type: "free", img: ""},
            {title: "Elite Bypass", price: "$25.00", type: "premium", img: ""},
            {title: "Speed Hack Lite", price: "FREE", type: "free", img: ""}
        ];

        function showType(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
            btn.className = type === 'premium' ? 'tab-btn active-premium' : 'tab-btn active-free';
            
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            products.filter(p => p.type === type).forEach(p => {
                grid.innerHTML += `
                    <div class="neon-card">
                        ${p.type === 'free' ? '<span class="free-tag">مجاني</span>' : ''}
                        <h3 style="font-family:'Orbitron'; margin-bottom:10px;">${p.title}</h3>
                        <p style="opacity:0.6; font-size:14px;">سكربت احترافي مطور بواسطة حسن الشمري بأحدث تقنيات الحقن.</p>
                        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:900; color:${p.type === 'free' ? 'var(--free-green)' : 'var(--neon-ai)'}">${p.price}</span>
                            <button style="background:#fff; color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:800; cursor:pointer;">${p.type === 'free' ? 'تحميل' : 'شراء'}</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- نواة الذكاء الاصطناعي (Three.js) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(300, 300);
        document.getElementById('neural-sphere').appendChild(renderer.domElement);

        const coreGeo = new THREE.IcosahedronGeometry(1, 15);
        const coreMat = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true, transparent: true, opacity: 0.8 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        const light = new THREE.PointLight(0x00f2ff, 2, 100);
        light.position.set(5, 5, 5);
        scene.add(light);
        camera.position.z = 2.5;

        function animateCore() {
            requestAnimationFrame(animateCore);
            core.rotation.y += 0.005;
            core.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animateCore();

        // --- نظام التفاعل الذكي ---
        const msgs = ["CORE: ANALYZING USER...", "STATUS: SYSTEM PROTECTED", "WELCOME TO HASSAN WORLD", "IRAQI DEVELOPER DETECTED"];
        setInterval(() => {
            document.getElementById('ai-msg').innerText = msgs[Math.floor(Math.random()*msgs.length)];
        }, 3000);

        // --- مشغل الموسيقى ---
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('neural-sphere', { // مخفي خلف الكرة
                height: '0', width: '0', videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk', 'mute': 1 }
            });
        }
        function toggleMusic() {
            const btn = document.getElementById('play-toggle');
            if(player.isMuted()) { player.unMute(); btn.className = "fas fa-pause"; }
            else { player.mute(); btn.className = "fas fa-play"; }
        }

        window.onload = () => showType('premium', document.querySelector('.tab-btn'));
    </script>
</body>
</html>
