<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | NEURAL OS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root { --p-color: #00f2ff; --owner-gold: #ffcc00; --bg: #000; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Changa', sans-serif; overflow: hidden; }

        /* خلفية الذكاء الاصطناعي الصادمة */
        #canvas-container { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }

        /* واجهة المالك (Owner UI) */
        #owner-badge {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 204, 0, 0.1); border: 1px solid var(--owner-gold);
            padding: 10px 20px; border-radius: 50px; display: none;
            font-family: 'Orbitron'; color: var(--owner-gold); font-size: 12px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3); animation: pulse 2s infinite;
        }

        /* التصميم الزجاجي الفخم */
        .glass-panel {
            position: relative; z-index: 10; width: 92%; height: 90vh; margin: 5vh auto;
            background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* الهيدر */
        header { padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-family: 'Orbitron'; font-size: 28px; font-weight: 900; letter-spacing: 4px; }
        
        /* التبويبات */
        .tabs { display: flex; gap: 40px; }
        .tab-link { cursor: pointer; opacity: 0.4; transition: 0.4s; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .tab-link.active { opacity: 1; color: var(--p-color); text-shadow: 0 0 15px var(--p-color); }

        /* منطقة العرض */
        .viewport { flex: 1; padding: 40px; overflow-y: auto; scrollbar-width: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        /* كرت المنتج الفخم */
        .h-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; padding: 40px; position: relative; transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-style: preserve-3d;
        }
        .h-card:hover { transform: translateY(-20px) rotateX(10deg); border-color: var(--p-color); background: rgba(0, 242, 255, 0.03); }
        .h-card h3 { font-family: 'Orbitron'; font-size: 22px; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 15px; border-radius: 15px; border: none; background: #fff; color: #000; font-weight: 900; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-action:hover { background: var(--p-color); color: #fff; transform: scale(1.05); }

        /* لوحة المالك (مخفية للعامة) */
        #admin-view { display: none; }
        .admin-box { background: rgba(0,0,0,0.5); padding: 40px; border-radius: 30px; border: 1px dashed var(--owner-gold); }
        .h-input { width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 1px solid #222; color: #fff; border-radius: 12px; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="owner-badge"><i class="fas fa-crown"></i> OWNER: HASSAN ALI</div>
    <div id="canvas-container"></div>

    <div class="glass-panel">
        <header>
            <div class="logo">HASSAN<span style="color:var(--p-color)">.AI</span></div>
            <div class="tabs">
                <div class="tab-link active" onclick="switchTab('store', this)">المتجر العام</div>
                <div class="tab-link" onclick="switchTab('apps', this)">التطبيقات</div>
                <div id="owner-tab" class="tab-link" onclick="switchTab('admin', this)" style="display:none; color:var(--owner-gold)">التحكم بالمنصة</div>
            </div>
            <div id="status" style="font-size:10px; font-family:'Orbitron'; color:var(--p-color);">SYSTEM: STABLE</div>
        </header>

        <main class="viewport">
            <div id="store-view" class="section active">
                <h1 style="text-align:center; font-size:50px; font-weight:800; margin-bottom:50px;">مكتبة حسن علي الشمري</h1>
                <div class="grid" id="items-grid"></div>
            </div>

            <div id="apps-view" class="section" style="display:none">
                <h1 style="text-align:center; font-size:50px; font-weight:800; margin-bottom:50px;">التطبيقات المجانية</h1>
                <div class="grid" id="apps-grid"></div>
            </div>

            <div id="admin-view" class="section">
                <div class="admin-box">
                    <h2>نظام رفع البيانات الذكي</h2>
                    <input type="text" id="title" class="h-input" placeholder="عنوان العمل...">
                    <textarea id="desc" class="h-input" placeholder="الوصف..."></textarea>
                    <input type="text" id="link" class="h-input" placeholder="الرابط أو الكود...">
                    <select id="type" class="h-input">
                        <option value="store">سكربت</option>
                        <option value="apps">تطبيق</option>
                    </select>
                    <button class="btn-action" style="background:var(--owner-gold); color:#000;" onclick="uploadItem()">نشر في الموقع الآن</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- حماية المالك (Ownership Logic) ---
        // ملاحظة: لكي يعمل هذا عليك فتحه من الـ PC الخاص بك مرة واحدة ليقوم النظام بحفظ بصمتك.
        function setupOwner() {
            const pcId = localStorage.getItem('hassan_owner_key');
            if (!pcId) {
                // أول مرة تفتح الموقع من جهازك، سيتم اعتباره جهاز المالك
                localStorage.setItem('hassan_owner_key', 'HASSAN_PC_VALIDATED');
            }
            
            // تحقق إذا كان هذا هو جهاز حسن
            if(localStorage.getItem('hassan_owner_key') === 'HASSAN_PC_VALIDATED') {
                document.getElementById('owner-badge').style.display = 'block';
                document.getElementById('owner-tab').style.display = 'block';
                return true;
            }
            return false;
        }

        // --- محرك البيانات ---
        let storage = JSON.parse(localStorage.getItem('hassan_neural_data')) || [];

        function render() {
            const sGrid = document.getElementById('items-grid');
            const aGrid = document.getElementById('apps-grid');
            sGrid.innerHTML = ''; aGrid.innerHTML = '';

            storage.forEach((item, index) => {
                const card = `
                    <div class="h-card">
                        <div style="font-size:10px; color:var(--p-color); margin-bottom:10px;">ID: #${index+100}</div>
                        <h3>${item.title}</h3>
                        <p style="opacity:0.5; font-size:14px;">${item.desc}</p>
                        <button class="btn-action" onclick="window.open('${item.link}')">استخدام الآن</button>
                        ${setupOwner() ? `<button onclick="deleteItem(${index})" style="background:none; border:none; color:red; cursor:pointer; margin-top:10px; font-size:10px;">حذف من النظام</button>` : ''}
                    </div>
                `;
                if(item.type === 'store') sGrid.innerHTML += card;
                else aGrid.innerHTML += card;
            });
            localStorage.setItem('hassan_neural_data', JSON.stringify(storage));
        }

        function uploadItem() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const link = document.getElementById('link').value;
            const type = document.getElementById('type').value;

            if(title && link) {
                storage.push({title, desc, link, type});
                render();
                alert("تم النشر بنجاح يا حسن!");
            }
        }

        function deleteItem(index) {
            storage.splice(index, 1);
            render();
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id + '-view').style.display = 'block';
            document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- التأثيرات البصرية (AI Visuals) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<15000; i++) {
            starPos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x00f2ff, size: 0.7 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ثقب أسود مركزي
        const holeGeo = new THREE.TorusGeometry(10, 3, 16, 100);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const hole = new THREE.Mesh(holeGeo, holeMat);
        scene.add(hole);

        camera.position.z = 500;

        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.onload = () => { setupOwner(); render(); };
    </script>
</body>
</html>
