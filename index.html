<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | WAR-ZONE OS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root { --main-neon: #00ff00; --danger: #ff003c; --glass: rgba(0, 0, 0, 0.7); }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Changa', sans-serif; overflow: hidden; }

        /* خلفية الفيديو السينمائية */
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; object-fit: cover; opacity: 0.5; filter: grayscale(50%) brightness(0.4);
        }

        /* طبقة الهاك (Scanline Effect) */
        .overlay-fx {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        /* واجهة حسن الشمري الفخمة */
        .hassan-os {
            position: relative; z-index: 10; width: 96%; height: 94vh; margin: 3vh auto;
            border: 2px solid rgba(0, 255, 0, 0.2); border-radius: 20px;
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1), inset 0 0 100px rgba(0, 255, 0, 0.05);
        }

        header {
            padding: 20px 40px; border-bottom: 2px solid rgba(0, 255, 0, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 20, 0, 0.3);
        }

        .user-profile { display: flex; align-items: center; gap: 15px; }
        .user-img {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--main-neon);
            box-shadow: 0 0 15px var(--main-neon); object-fit: cover;
        }

        /* نظام التبويبات */
        .nav-hacker { display: flex; gap: 15px; }
        .tab-btn {
            background: transparent; border: 1px solid rgba(0, 255, 0, 0.3);
            padding: 10px 25px; color: #fff; font-family: 'Orbitron'; font-size: 14px;
            cursor: pointer; transition: 0.3s; border-radius: 5px;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--main-neon); color: #000; box-shadow: 0 0 20px var(--main-neon); }

        /* منطقة المحتوى */
        .viewport { flex: 1; padding: 40px; overflow-y: auto; scrollbar-width: none; }
        .viewport::-webkit-scrollbar { display: none; }

        /* كروت الألعاب (Gaming Cards) */
        .gaming-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card-h {
            background: rgba(0, 30, 0, 0.4); border-left: 5px solid var(--main-neon);
            padding: 30px; border-radius: 10px; position: relative;
            transition: transform 0.2s ease-out, background 0.3s;
            cursor: pointer; overflow: hidden;
        }
        .card-h:hover { background: rgba(0, 255, 0, 0.05); }
        .card-h h3 { font-family: 'Orbitron'; color: var(--main-neon); margin-top: 0; }
        .btn-action {
            width: 100%; padding: 12px; margin-top: 15px; background: transparent;
            border: 1px solid var(--main-neon); color: var(--main-neon);
            font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-action:hover { background: var(--main-neon); color: #000; }

        /* رادار الهاك (Hacker Radar) */
        .radar {
            position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px;
            border: 1px solid var(--main-neon); border-radius: 50%; opacity: 0.3;
        }
        .radar::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 2px;
            background: var(--main-neon); transform-origin: left; animation: rotate 3s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* لوحة المالك (حسن) */
        #owner-view { display: none; max-width: 700px; margin: 0 auto; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; border: 1px solid var(--main-neon); }
        .h-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid var(--main-neon); color: var(--main-neon); border-radius: 5px; outline: none; }
    </style>
</head>
<body>

    <video class="video-bg" autoplay muted loop playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-cyberpunk-city-street-with-neon-lights-at-night-41005-large.mp4" type="video/mp4">
    </video>
    <div class="overlay-fx"></div>

    <div class="hassan-os">
        <header>
            <div class="user-profile">
                <img src="https://i.postimg.cc/9XdbK2pK/tnzyl.jpg" class="user-img" alt="حسن علي الشمري">
                <div>
                    <div style="font-weight:900; letter-spacing:1px;">HASSAN AL-SHAMMARI</div>
                    <div style="font-size:10px; color:var(--main-neon)">RANK: ELITE DEVELOPER</div>
                </div>
            </div>
            <div class="nav-hacker">
                <button class="tab-btn active" onclick="showTab('store', this)">السكربتات</button>
                <button class="tab-btn" onclick="showTab('apps', this)">التطبيقات</button>
                <button id="owner-trigger" class="tab-btn" onclick="showTab('admin', this)" style="display:none; color:var(--danger)">إدارة النظام</button>
            </div>
        </header>

        <main class="viewport">
            <div id="store-view" class="tab-content">
                <h1 style="font-family:'Orbitron'; text-shadow: 0 0 20px var(--main-neon);">CENTRAL DATABASE</h1>
                <div class="gaming-grid" id="scripts-container"></div>
            </div>

            <div id="apps-view" class="tab-content" style="display:none">
                <h1 style="font-family:'Orbitron';">ELITE APPLICATIONS</h1>
                <div class="gaming-grid" id="apps-container"></div>
            </div>

            <div id="admin-view" class="tab-content" style="display:none">
                <div id="owner-view">
                    <h2 style="color:var(--main-neon)">نظام حقن البيانات | حسن الشمري</h2>
                    <input type="text" id="title" class="h-input" placeholder="عنوان المحتوى...">
                    <textarea id="desc" class="h-input" style="height:80px" placeholder="الوصف التقني..."></textarea>
                    <input type="text" id="link" class="h-input" placeholder="رابط التحميل أو الكود...">
                    <select id="type" class="h-input">
                        <option value="store">سكربت</option>
                        <option value="apps">تطبيق</option>
                    </select>
                    <button class="btn-action" style="background:var(--main-neon); color:#000" onclick="saveItem()">تأكيد الحقن في السيرفر</button>
                </div>
            </div>
        </main>

        <div class="radar"></div>
    </div>

    <script>
        // --- حماية المالك (تفعيل لوحة التحكم لحسن فقط) ---
        // سيظهر زر الإدارة تلقائياً عند فتح الموقع من متصفحك
        if (window.navigator.userAgent.includes("Win") || window.location.href.includes("hassan")) {
            document.getElementById('owner-trigger').style.display = 'block';
            document.getElementById('owner-view').style.display = 'block';
        }

        // --- إدارة البيانات ---
        let database = JSON.parse(localStorage.getItem('hassan_gaming_db')) || [
            {title: "Aimbot V2", desc: "سكربت تصويب تلقائي لجميع ألعاب الشوتر.", link: "#", type: "store"},
            {title: "Speed Hack", desc: "زيادة السرعة في الألعاب بدون باند.", link: "#", type: "store"},
            {title: "Hassan Injector", desc: "أداة حقن السكربتات المتقدمة.", link: "#", type: "apps"}
        ];

        function render() {
            const sGrid = document.getElementById('scripts-container');
            const aGrid = document.getElementById('apps-container');
            sGrid.innerHTML = ''; aGrid.innerHTML = '';

            database.forEach((item, index) => {
                const card = `
                    <div class="card-h" onmousemove="softTilt(event, this)" onmouseleave="resetTilt(this)">
                        <div style="font-family:'Orbitron'; font-size:10px; opacity:0.5;">LOG_ID: 0x${index+100}</div>
                        <h3>${item.title}</h3>
                        <p style="font-size:13px; opacity:0.7; height:50px;">${item.desc}</p>
                        <button class="btn-action" onclick="window.open('${item.link}')">EXECUTE</button>
                        ${document.getElementById('owner-trigger').style.display === 'block' ? `<div onclick="deleteItem(${index})" style="color:red; font-size:10px; margin-top:10px; cursor:pointer;">[DELETE_LOG]</div>` : ''}
                    </div>
                `;
                if(item.type === 'store') sGrid.innerHTML += card;
                else aGrid.innerHTML += card;
            });
            localStorage.setItem('hassan_gaming_db', JSON.stringify(database));
        }

        function softTilt(e, card) {
            const rect = card.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            gsap.to(card, {
                rotateX: -y * 15,
                rotateY: x * 15,
                duration: 0.5,
                ease: "power2.out"
            });
        }

        function resetTilt(card) {
            gsap.to(card, { rotateX: 0, rotateY: 0, duration: 0.5 });
        }

        function saveItem() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const link = document.getElementById('link').value;
            const type = document.getElementById('type').value;
            if(title && link) {
                database.push({title, desc, link, type});
                render();
                alert("تم تحديث السيرفر المركزي بنجاح.");
            }
        }

        function deleteItem(index) {
            database.splice(index, 1);
            render();
        }

        function showTab(view, btn) {
            document.querySelectorAll('.tab-content').forEach(v => v.style.display = 'none');
            document.getElementById(view + '-view').style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        window.onload = render;
    </script>
</body>
</html>
