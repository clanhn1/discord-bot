<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | 30nr</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@800&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --glow-color: rgba(255, 255, 255, 0.3);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; font-family: 'Poppins', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        #video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0; transition: opacity 3s;
        }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; transform: scale(1.5); }

        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }

        #entry-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .enter-btn {
            color: #fff; font-size: 28px; letter-spacing: 12px;
            border: 1px solid #fff; padding: 20px 45px; transition: 0.5s;
        }

        /* البطاقة مع توهج الإيقاع */
        .main-card {
            position: relative; z-index: 10; width: 460px;
            background: var(--glass); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px); border: 1px solid var(--border);
            border-radius: 45px; padding: 60px 40px; text-align: center;
            opacity: 0; transform: translateY(40px);
            transition: 2s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 0 0px var(--glow-color);
        }
        .main-card.show { opacity: 1; transform: translateY(0); }

        /* الأفاتار - رابط جديد ومضمون */
        .avatar-container {
            width: 170px; height: 170px; margin: -100px auto 25px auto;
            position: relative;
        }
        .avatar-img {
            width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid #fff; box-shadow: 0 0 40px rgba(255,255,255,0.2);
            object-fit: cover; background: #111;
        }

        h1 {
            font-family: 'Anek Malayalam', sans-serif;
            font-size: 44px; color: #fff; margin: 10px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .tag { color: #888; font-size: 18px; letter-spacing: 6px; margin-bottom: 30px; display: block; }
        .bio { color: #fff; font-size: 21px; font-weight: 300; line-height: 1.6; margin-bottom: 40px; }

        .btn-action {
            display: inline-block; padding: 18px 55px; background: #fff;
            color: #000; text-decoration: none; font-weight: bold;
            border-radius: 100px; transition: 0.4s; font-size: 19px;
        }
        .btn-action:hover { transform: scale(1.08); box-shadow: 0 0 40px #fff; }

        .socials { display: flex; justify-content: center; gap: 35px; margin-bottom: 30px; }
        .socials a { color: #fff; font-size: 28px; opacity: 0.6; transition: 0.3s; }
        .socials a:hover { opacity: 1; transform: scale(1.2); text-shadow: 0 0 15px #fff; }

        /* حركة التوهج المتزامن */
        .pulse-glow {
            animation: audioPulse 0.5s infinite alternate ease-in-out;
        }
        @keyframes audioPulse {
            0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
            100% { box-shadow: 0 0 80px var(--glow-color); transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div id="entry-overlay" onclick="launch()">
        <div class="enter-btn">HASSAN ALI</div>
    </div>

    <div id="video-bg"><div id="player"></div></div>
    <canvas id="canvas-bg"></canvas>

    <div class="main-card" id="card">
        <div class="socials">
            <a href="https://www.instagram.com/76h16/?hl=ar" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@6r09" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>

        <div class="avatar-container">
            <img src="https://i.ibb.co/LzfNqf9/hassan-avatar.png" class="avatar-img" alt="Hassan" 
                 onerror="this.src='https://ui-avatars.com/api/?name=Hassan&background=000&color=fff&size=512'">
        </div>
        
        <h1>حسن علي الشمري</h1>
        <span class="tag">@30nr</span>

        <p class="bio">
            عمك حسن هنا.. <br>
            <b>الساحة محجوزة، طب وتونس.</b>
        </p>

        <a href="https://discord.gg/CTwKRt7u" class="btn-action" target="_blank">انضم لسيرفري</a>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk' }
            });
        }

        function launch() {
            document.getElementById('entry-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entry-overlay').style.display = 'none';
                document.getElementById('card').classList.add('show');
                document.getElementById('video-bg').style.opacity = '0.25';
            }, 1000);

            if (player) {
                player.playVideo();
                player.setVolume(100);
                // تفعيل توهج الإيقاع بعد 5 ثواني
                setTimeout(() => {
                    document.getElementById('card').classList.add('pulse-glow');
                }, 5000);
            }
        }

        // Particle background code...
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-bg'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for (let i = 0; i < 3000; i++) pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const points = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.5 }));
        scene.add(points);
        camera.position.z = 500;
        function animate() { requestAnimationFrame(animate); points.rotation.y += 0.0008; renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
