<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASSAN AL-SHAMMARI | 30nr</title>
    <style>
        :root {
            --main-white: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.8);
            --bg-dark: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تأثير النبض في الخلفية */
        .pulse-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .pulse-circle {
            position: absolute;
            border: 2px solid var(--main-white);
            border-radius: 50%;
            opacity: 0;
            animation: ripple 1.5s infinite;
        }

        /* فيديو يوتيوب مخفي للتحكم بالصوت */
        #yt-player {
            position: absolute;
            width: 0; height: 0; opacity: 0;
        }

        /* شاشة الدخول الفخمة */
        #entry-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 1.5s;
        }

        .enter-text {
            color: #fff;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: flash 1s infinite alternate;
        }

        /* البطاقة العصرية (Modern Card) */
        .modern-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(50px);
            transition: 1.5s all cubic-bezier(0.19, 1, 0.22, 1);
        }

        .modern-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* الأفاتار بشكل عصري */
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 40px; /* زوايا مدورة عصرية */
            border: 2px solid var(--main-white);
            box-shadow: 0 0 40px var(--accent-glow);
            margin-bottom: 30px;
            object-fit: cover;
            background: #222;
        }

        h1 {
            font-size: 50px;
            color: var(--main-white);
            margin: 0;
            font-weight: 800;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .handle {
            color: #888;
            font-size: 20px;
            letter-spacing: 5px;
            margin-bottom: 30px;
            display: block;
        }

        .status-msg {
            color: #fff;
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* زر الانضمام المضيء */
        .join-btn {
            display: inline-block;
            background: var(--main-white);
            color: #000;
            padding: 20px 60px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .join-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 50px var(--accent-glow);
        }

        /* الحركات */
        @keyframes ripple {
            0% { width: 100px; height: 100px; opacity: 1; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        @keyframes flash {
            from { opacity: 0.3; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* اهتزاز الشاشة مع الإيقاع */
        .shake-effect {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <div id="entry-overlay" onclick="startExperience()">
        <div class="enter-text">ENTER REALM</div>
    </div>

    <div class="pulse-bg" id="pulse-box">
        <div class="pulse-circle"></div>
    </div>

    <div id="yt-player"></div>

    <div class="modern-container" id="card">
        <img src="https://cdn.discordapp.com/avatars/452800723646677002/097a9f7e44a47895f329240801833878.png?size=512" 
             class="profile-img" alt="Hassan">
        
        <h1>حسن علي الشمري</h1>
        <span class="handle">30nr</span>

        <p class="status-msg">
            عمك حسن هنا.. <br>
            <b>الساحة محجوزة، انضم لسيرفري وشوف الفرق.</b>
        </p>

        <a href="https://discord.gg/CTwKRt7u" class="join-btn">انضم لسيرفري</a>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: 'RW7DcfTGdHk',
                playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'RW7DcfTGdHk' }
            });
        }

        function startExperience() {
            document.getElementById('entry-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entry-overlay').style.display = 'none';
                document.getElementById('card').classList.add('active');
            }, 1000);

            if (player && player.playVideo) {
                player.playVideo();
                
                // تفعيل تأثير النبض المتزامن مع الإيقاع
                setInterval(() => {
                    createPulse();
                    // اهتزاز خفيف للبطاقة مع كل نبضة
                    document.getElementById('card').classList.toggle('shake-effect');
                }, 450); // توقيت تقريبي ليتوافق مع ايقاع الأغنية السريع
            }
        }

        function createPulse() {
            const box = document.getElementById('pulse-box');
            const circle = document.createElement('div');
            circle.className = 'pulse-circle';
            box.appendChild(circle);
            
            setTimeout(() => {
                circle.remove();
            }, 1500);
        }
    </script>
</body>
</html>
